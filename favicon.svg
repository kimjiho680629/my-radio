<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1c1f28"/>
      <stop offset="100%" stop-color="#0b0c10"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="512" height="512" fill="url(#bg)" rx="110"/>
  <rect width="510" height="510" x="1" y="1" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" rx="109"/>

  <!-- 사운드 웨이브 바 -->
  <rect x="132" y="159" width="16" height="48" rx="8" fill="rgba(255,255,255,0.45)"/>
  <rect x="170" y="130" width="16" height="87" rx="8" fill="rgba(255,255,255,0.7)"/>
  <rect x="208" y="90" width="16" height="140" rx="8" fill="rgba(255,255,255,0.95)"/>
  <rect x="248" y="65" width="16" height="173" rx="8" fill="#ff3b30"/>
  <rect x="288" y="90" width="16" height="140" rx="8" fill="rgba(255,255,255,0.95)"/>
  <rect x="326" y="130" width="16" height="87" rx="8" fill="rgba(255,255,255,0.7)"/>
  <rect x="364" y="159" width="16" height="48" rx="8" fill="rgba(255,255,255,0.45)"/>

  <!-- LIVE 닷 -->
  <circle cx="417" cy="64" r="8" fill="#ff3b30" filter="url(#glow)"/>

  <!-- 타이포그래피 MBC -->
  <text x="256" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-weight="900" font-size="108" fill="#ffffff" letter-spacing="-1">MBC</text>

  <!-- 서브 타이틀 캡슐 -->
  <rect x="156" y="398" width="200" height="46" rx="23" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="256" y="429" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-weight="700" font-size="20" fill="#ebeef5" letter-spacing="1">표준FM · 95.9</text>
</svg>
