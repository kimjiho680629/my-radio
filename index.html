<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MBC 라디오">
    <meta name="theme-color" content="#0a0b0e">
    <link rel="apple-touch-icon" href="https://i.ibb.co/hR8Nf8x/mbc-icon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://minisw.imbc.com">
    <link rel="preconnect" href="https://sminiplay.imbc.com">
    <link rel="preconnect" href="https://miniapi.imbc.com">
    <link rel="preconnect" href="https://img.imbc.com">
    <title>MBC 표준FM LIVE</title>
    <style>
        :root {
            --bg-base: #0c0d10;
            --surface-panel: rgba(22, 24, 29, 0.72);
            --surface-border: rgba(255, 255, 255, 0.08);
            --surface-highlight: rgba(255, 255, 255, 0.04);
            --text-primary: #f5f6f8;
            --text-secondary: #8e93a0;
            --text-tertiary: #565a66;
            --accent-live: #ff3b30;
            --accent-active: #ffffff;
            --accent-safe: #34c759;
            --accent-charging: #ff9f0a;
            --radius-main: 32px;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-base);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard", "Helvetica Neue", sans-serif;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* ── 동적 앰비언트 배경 (현재 프로그램 커버 아트 블러) ── */
        .ambient-glow-wrapper {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ambient-glow {
            position: absolute;
            top: -20%; left: -20%;
            width: 140%; height: 140%;
            background-size: cover;
            background-position: center;
            filter: blur(85px) saturate(140%) brightness(0.28);
            transform: translateZ(0);
            transition: opacity 1.2s ease;
            opacity: 0.65;
        }

        .ambient-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 35%, transparent 20%, rgba(12, 13, 16, 0.85) 85%);
        }

        /* ── 메인 컨테이너 ── */
        .app-viewport {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: calc(env(safe-area-inset-top) + 16px) 24px calc(env(safe-area-inset-bottom) + 20px);
            max-width: 440px;
            margin: 0 auto;
        }

        /* ── 상단 메타 헤더 ── */
        .top-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px;
        }

        .station-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .station-freq {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: -0.2px;
        }

        .live-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-live);
            letter-spacing: 0.8px;
            background: rgba(255, 59, 48, 0.12);
            border: 1px solid rgba(255, 59, 48, 0.25);
            padding: 3px 9px;
            border-radius: 20px;
        }

        .live-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background-color: var(--accent-live);
            box-shadow: 0 0 8px rgba(255, 59, 48, 0.8);
        }

        /* ── 듀얼 시계 인디케이터 (정밀 계측형) ── */
        .world-clock-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            font-size: 0.74rem;
            color: var(--text-tertiary);
            margin: 8px 0 16px;
            letter-spacing: 0.3px;
        }

        .clock-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clock-label {
            font-weight: 600;
            opacity: 0.75;
            font-size: 0.65rem;
        }

        .clock-val {
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            font-size: 0.78rem;
        }

        .clock-sep {
            color: var(--surface-border);
            font-size: 0.6rem;
        }

        /* ── 프로그램 앨범 커버 ── */
        .cover-section {
            position: relative;
            width: 230px;
            height: 230px;
            margin: 4px auto 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cover-art-box {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            background: #191b20;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.04);
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1), box-shadow 0.4s ease;
        }

        .app-viewport.is-playing .cover-art-box {
            transform: scale(1.02);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.12);
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.5s ease;
        }

        .cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: linear-gradient(180deg, #1f2229 0%, #15171c 100%);
            color: var(--text-tertiary);
        }

        .cover-placeholder-logo {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: rgba(255, 255, 255, 0.2);
        }

        /* ── 온에어 프로그램 메타 정보 ── */
        .program-info {
            width: 100%;
            text-align: center;
            padding: 0 12px;
            margin-bottom: 14px;
        }

        .program-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.4px;
            margin: 0 0 6px;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .program-time-wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .prog-day {
            background: rgba(255, 255, 255, 0.07);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.68rem;
            color: var(--text-tertiary);
        }

        .next-program-preview {
            margin-top: 6px;
            font-size: 0.72rem;
            color: var(--text-tertiary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── 버퍼 상태 게이지 (슬릭 인디케이터 & 모바일 적응형 네트워크) ── */
        .buffer-monitor {
            width: 100%;
            background: var(--surface-panel);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--surface-border);
            border-radius: 18px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }

        .buffer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            margin-bottom: 8px;
        }

        .buf-title-group {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .buf-title {
            color: var(--text-tertiary);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .net-tag {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.3s ease;
        }

        .net-tag.optimal {
            color: var(--accent-safe);
            border-color: rgba(52, 199, 89, 0.35);
            background: rgba(52, 199, 89, 0.12);
        }

        .net-tag.charging {
            color: var(--accent-charging);
            border-color: rgba(255, 159, 10, 0.35);
            background: rgba(255, 159, 10, 0.12);
        }

        .net-tag.low {
            color: var(--accent-live);
            border-color: rgba(255, 59, 48, 0.35);
            background: rgba(255, 59, 48, 0.12);
        }

        .net-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: currentColor;
        }

        .buf-stats {
            display: flex;
            align-items: center;
            gap: 6px;
            font-variant-numeric: tabular-nums;
        }

        .buf-sec {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 0.8rem;
        }

        .buf-pill {
            font-size: 0.62rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
            letter-spacing: 0.3px;
        }

        .pill-safe { background: rgba(52, 199, 89, 0.15); color: var(--accent-safe); }
        .pill-charging { background: rgba(255, 159, 10, 0.15); color: var(--accent-charging); }
        .pill-low { background: rgba(255, 59, 48, 0.15); color: var(--accent-live); }

        .gauge-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .gauge-bar {
            height: 100%;
            width: 0%;
            background: var(--text-primary);
            border-radius: 2px;
            transition: width 0.4s ease, background 0.3s;
        }

        .buffer-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.65rem;
            color: var(--text-tertiary);
            margin-top: 8px;
            font-variant-numeric: tabular-nums;
        }

        /* ── 오디오 컨트롤 바 ── */
        .controls-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .main-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            width: 100%;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        /* ── 메인 재생 버튼 (솔리드 미니멀 하드웨어 감성) ── */
        .play-trigger {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .play-trigger:active {
            transform: scale(0.92);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        .play-glyph {
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 17px solid #000000;
            margin-left: 4px;
            transition: opacity 0.2s;
        }

        .pause-glyph {
            display: none;
            width: 18px;
            height: 20px;
            gap: 5px;
        }

        .pause-glyph::before,
        .pause-glyph::after {
            content: '';
            flex: 1;
            background: #000000;
            border-radius: 2px;
        }

        .spinner-ring {
            display: none;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(0, 0, 0, 0.18);
            border-top-color: #000000;
            border-radius: 50%;
            animation: spin-loop 0.7s linear infinite;
        }

        @keyframes spin-loop {
            to { transform: rotate(360deg); }
        }

        /* 버튼 상태 */
        .play-trigger.is-loading .play-glyph { display: none; }
        .play-trigger.is-loading .pause-glyph { display: none; }
        .play-trigger.is-loading .spinner-ring { display: block; }

        .play-trigger.is-playing .play-glyph { display: none; }
        .play-trigger.is-playing .pause-glyph { display: flex; }

        /* ── 볼륨 슬라이더 (정밀 트랙) ── */
        .volume-bar-wrap {
            width: 100%;
            max-width: 260px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .vol-icon {
            font-size: 0.8rem;
            color: var(--text-tertiary);
        }

        .vol-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 3px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
            outline: none;
        }

        .vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        /* ── 상태 피드백 메시지 ── */
        .status-caption {
            font-size: 0.74rem;
            font-weight: 500;
            color: var(--text-tertiary);
            min-height: 1rem;
            text-align: center;
            transition: color 0.3s;
        }

        .status-caption.safe { color: var(--accent-safe); }
        .status-caption.warn { color: var(--accent-charging); }
        .status-caption.error { color: var(--accent-live); }

        /* ── 디버그/버전 푸터 ── */
        .footer-debug {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <!-- 동적 앰비언트 백드롭 -->
    <div class="ambient-glow-wrapper">
        <div class="ambient-glow" id="ambient-glow"></div>
        <div class="ambient-overlay"></div>
    </div>

    <div class="app-viewport" id="app-viewport">
        <!-- 1. 상단 바 -->
        <header class="top-nav">
            <div class="station-brand">
                <span class="brand-badge">MBC</span>
                <span class="station-freq">표준FM 95.9</span>
            </div>
            <div class="live-tag">
                <span class="live-dot"></span>
                <span>ON AIR</span>
            </div>
        </header>

        <!-- 2. 시계 인디케이터 (시드니 / 서울) -->
        <div class="world-clock-bar">
            <div class="clock-item">
                <span class="clock-label">SYDNEY</span>
                <span class="clock-val" id="syd-time">--:--</span>
            </div>
            <span class="clock-sep">·</span>
            <div class="clock-item">
                <span class="clock-label">SEOUL</span>
                <span class="clock-val" id="sel-time">--:--</span>
            </div>
        </div>

        <!-- 3. 현재 프로그램 앨범 커버 아트 -->
        <section class="cover-section">
            <div class="cover-art-box">
                <div class="cover-placeholder" id="cover-placeholder">
                    <span class="cover-placeholder-logo">MBC</span>
                    <span style="font-size:0.75rem; letter-spacing:0.5px;">스마트라디오 mini</span>
                </div>
                <img id="program-cover" class="cover-img" style="display:none;" alt="프로그램 앨범 아트">
            </div>
        </section>

        <!-- 4. 실시간 프로그램 타이틀 & 편성 정보 -->
        <div class="program-info">
            <h1 class="program-title" id="program-title">MBC 표준FM 라이브</h1>
            <div class="program-time-wrap">
                <span class="prog-day" id="prog-day">LIVE</span>
                <span id="prog-time">편성표 동기화 중...</span>
            </div>
            <div class="next-program-preview" id="next-prog">다음 방송 준비 중</div>
        </div>

        <!-- 5. 버퍼 모니터 게이지 바 (모바일 적응형 네트워크) -->
        <div class="buffer-monitor">
            <div class="buffer-header">
                <div class="buf-title-group">
                    <span class="buf-title">BUFFER RESERVE</span>
                    <span class="net-tag optimal" id="net-tag">
                        <span class="net-dot"></span>
                        <span id="net-tag-text">모바일 오토</span>
                    </span>
                </div>
                <div class="buf-stats">
                    <span class="buf-sec" id="buf-text">0s</span>
                    <span class="buf-pill pill-low" id="buf-pill">대기</span>
                </div>
            </div>
            <div class="gauge-track">
                <div class="gauge-bar" id="gauge-bar"></div>
            </div>
            <div class="buffer-meta-row">
                <span id="meta-net-stat">NET: 모바일 4G/5G</span>
                <span id="meta-target-delay">TARGET: -60s</span>
                <span id="meta-total">DATA: 0.0 MB</span>
            </div>
        </div>

        <!-- 6. 메인 컨트롤 -->
        <div class="controls-panel">
            <div class="main-controls">
                <button class="icon-btn" id="sync-btn" title="스트림 및 편성표 완전 새로고침">🔄</button>
                
                <button class="play-trigger" id="play-btn" title="재생 / 일시정지">
                    <div class="play-glyph"></div>
                    <div class="pause-glyph"></div>
                    <div class="spinner-ring"></div>
                </button>

                <button class="icon-btn" id="reload-schedule-btn" title="편성표 다시 불러오기">📻</button>
            </div>

            <div class="volume-bar-wrap">
                <span class="vol-icon">🔈</span>
                <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.01" value="1">
                <span class="vol-icon">🔊</span>
            </div>

            <div class="status-caption" id="status-caption">재생 버튼을 탭하여 청취하세요</div>
        </div>

        <div class="footer-debug" id="debug-text">모바일 적응형 네트워크 가드 (v1.7.0) · Australia Edition</div>
    </div>

    <!-- 백그라운드 오디오 엘리먼트 -->
    <audio id="audio" playsinline webkit-playsinline preload="auto"></audio>

    <!-- HLS.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // DOM 엘리먼트 참조
        const audio             = document.getElementById('audio');
        const playBtn           = document.getElementById('play-btn');
        const syncBtn           = document.getElementById('sync-btn');
        const reloadScheduleBtn = document.getElementById('reload-schedule-btn');
        const volSlider         = document.getElementById('vol-slider');
        const statusCaption     = document.getElementById('status-caption');
        const debugText         = document.getElementById('debug-text');
        const appViewport       = document.getElementById('app-viewport');

        const sydTimeEl         = document.getElementById('syd-time');
        const selTimeEl         = document.getElementById('sel-time');

        const programTitleEl    = document.getElementById('program-title');
        const progDayEl         = document.getElementById('prog-day');
        const progTimeEl        = document.getElementById('prog-time');
        const nextProgEl        = document.getElementById('next-prog');
        const programCoverEl    = document.getElementById('program-cover');
        const coverPlaceholderEl= document.getElementById('cover-placeholder');
        const ambientGlowEl     = document.getElementById('ambient-glow');

        const bufTextEl         = document.getElementById('buf-text');
        const bufPillEl         = document.getElementById('buf-pill');
        const gaugeBarEl        = document.getElementById('gauge-bar');
        const netTagEl          = document.getElementById('net-tag');
        const netTagTextEl      = document.getElementById('net-tag-text');
        const metaNetStatEl     = document.getElementById('meta-net-stat');
        const metaTargetDelayEl = document.getElementById('meta-target-delay');
        const metaTotalEl       = document.getElementById('meta-total');

        // 상태 변수
        let hls                 = null;
        let userWantsPlay       = false;
        let isLivePlaying       = false;
        let schedulesCache      = null;
        let currentProgramMeta  = null;
        let lastSeoulCheckMin   = -1;

        // 버퍼링 및 통계
        let totalDataBytes      = 0;
        let lastTickTime        = 0;
        let lastAudioPosition   = -1;
        let stallCounter        = 0;
        let initialBufferSeek   = false;

        // 예비 스트림 풀
        const BACKUP_STREAMS = [
            'https://5ddfd163bd00d.streamlock.net/STDFM/STDFM/playlist.m3u8',
            'https://stream.bsmbc.com/live/mp4:BusanMBC-LiveStream-AM/playlist.m3u8'
        ];
        let backupStreamIndex = 0;

        // ──────────────────────────────────────────────────────────
        // [v1.7.0] 모바일 적응형 네트워크 엔진 (Mobile Adaptive Guard)
        // ──────────────────────────────────────────────────────────
        class MobileAdaptiveEngine {
            constructor() {
                this.conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                this.isMobileDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0);
                
                this.networkType = this.isMobileDevice ? 'CELLULAR' : 'AUTO';
                this.quality = 'GOOD';       // 'OPTIMAL' | 'GOOD' | 'FAIR' | 'POOR'
                this.rtt = 0;               // ms
                this.downlink = 0;          // Mbps
                this.effectiveType = '4g';
                
                this.fragHistory = [];
                this.lastSpeedKbps = 128;
                this.lastPingTime = 0;
                
                // 모바일 환경에 특화된 동적 버퍼링 파라미터
                this.targetDelaySec = 60;
                this.maxBufferLength = 180;
                this.fragLoadingTimeout = 18000;
                this.fragLoadingMaxRetry = 12;
                
                this.setupListeners();
                this.assessNetwork();
                this.runLightweightPing();
            }

            setupListeners() {
                if (this.conn) {
                    this.conn.addEventListener('change', () => this.handleConnectionChange());
                }

                window.addEventListener('online', () => {
                    this.assessNetwork();
                    setStatus('인터넷 재연결 감지 — 방송 동기화', 'safe');
                    if (userWantsPlay && (!isLivePlaying || audio.paused)) {
                        initStream(true);
                    }
                });

                window.addEventListener('offline', () => {
                    this.quality = 'POOR';
                    this.updateUI('📶 오프라인', 'low', 'NET: 연결 끊김', 'TARGET: 방어 중');
                    setStatus('네트워크 오프라인 — 잔여 버퍼로 재생 유지', 'warn');
                });
            }

            handleConnectionChange() {
                const prevType = this.networkType;
                this.assessNetwork();
                
                if (prevType !== this.networkType) {
                    debugText.innerText = `Network switched: ${prevType} → ${this.networkType}`;
                    const currentBuf = getBufferSeconds();
                    
                    if (isLivePlaying) {
                        setStatus(`통신망 전환(${this.networkType}) — 무중단 유지`, 'warn');
                        // 버퍼가 10초 미만으로 위험하면 신속하게 새 소켓으로 재연결
                        if (currentBuf < 10) {
                            setTimeout(() => {
                                if (userWantsPlay) initStream(true);
                            }, 500);
                        }
                    }
                }
            }

            // HLS.js 세그먼트 전송 통계 실측 수신
            recordFragStats(stats) {
                if (!stats || !stats.loading) return;
                const loadDuration = Math.max(1, stats.loading.end - stats.loading.start);
                const bytes = stats.total || 0;
                const speedKbps = Math.round((bytes * 8) / (loadDuration / 1000) / 1024);
                
                this.lastSpeedKbps = speedKbps;
                this.fragHistory.push({ time: Date.now(), speed: speedKbps, duration: loadDuration });
                if (this.fragHistory.length > 8) this.fragHistory.shift();

                if (stats.loading.first && stats.loading.first > stats.loading.start) {
                    const estRtt = Math.round(stats.loading.first - stats.loading.start);
                    if (estRtt > 0 && estRtt < 4000) {
                        this.rtt = estRtt;
                    }
                }

                this.assessNetwork();
            }

            // iOS Safari 네이티브 등 HLS 미지원 환경을 위한 경량 핑 (25초 주기)
            async runLightweightPing() {
                const now = Date.now();
                if (now - this.lastPingTime < 20000) return;
                this.lastPingTime = now;

                try {
                    const t0 = performance.now();
                    await fetch(`https://miniapi.imbc.com/favicon.ico?_t=${now}`, {
                        method: 'HEAD',
                        mode: 'no-cors',
                        cache: 'no-store'
                    });
                    const t1 = performance.now();
                    const measuredRtt = Math.round(t1 - t0);
                    if (measuredRtt > 0 && measuredRtt < 5000) {
                        this.rtt = measuredRtt;
                        this.assessNetwork();
                    }
                } catch (e) {
                    // 무시 (오프라인 등)
                }
            }

            // 네트워크 상태 종합 판정 및 모바일 파라미터 자동 조절
            assessNetwork() {
                // 1. Connection API 분석
                if (this.conn) {
                    this.effectiveType = this.conn.effectiveType || '4g';
                    this.downlink = this.conn.downlink || 0;
                    if (this.conn.rtt && this.conn.rtt > 0) {
                        this.rtt = this.conn.rtt;
                    }

                    if (this.conn.type === 'wifi' || this.conn.type === 'ethernet') {
                        this.networkType = 'WIFI';
                    } else if (this.conn.type === 'cellular') {
                        this.networkType = 'CELLULAR';
                    } else {
                        this.networkType = this.isMobileDevice ? 'CELLULAR' : 'AUTO';
                    }
                } else {
                    this.networkType = this.isMobileDevice ? 'CELLULAR' : 'AUTO';
                }

                // 2. 실측 속도 및 버퍼 상태 기반 종합 품질 판정
                const avgSpeed = this.fragHistory.length > 0
                    ? (this.fragHistory.reduce((s, f) => s + f.speed, 0) / this.fragHistory.length)
                    : 1200;

                const currentBuf = getBufferSeconds();

                if (this.effectiveType === '2g' || this.effectiveType === 'slow-2g' || (avgSpeed < 180 && isLivePlaying) || (currentBuf < 6 && isLivePlaying && stallCounter > 1)) {
                    this.quality = 'POOR';
                } else if (this.effectiveType === '3g' || avgSpeed < 450 || this.rtt > 320) {
                    this.quality = 'FAIR';
                } else if (this.rtt < 120 && avgSpeed > 1500) {
                    this.quality = 'OPTIMAL';
                } else {
                    this.quality = 'GOOD';
                }

                // 3. 모바일 환경에 따른 자동 버퍼/연결 파라미터 조절
                if (this.quality === 'POOR') {
                    // 모바일 음영지역/기지국 신호 저하: 버퍼 타깃과 재시도를 최대로 높여 버팀
                    this.targetDelaySec = 85;
                    this.maxBufferLength = 300; // 최대 5분 분량 사전 확보 시도
                    this.fragLoadingTimeout = 28000;
                    this.fragLoadingMaxRetry = 16;
                } else if (this.quality === 'FAIR') {
                    // 3G 또는 전파 불안정: 안전 지연 72초, 버퍼 240초
                    this.targetDelaySec = 72;
                    this.maxBufferLength = 240;
                    this.fragLoadingTimeout = 22000;
                    this.fragLoadingMaxRetry = 14;
                } else if (this.quality === 'OPTIMAL') {
                    // 5G/LTE 초고속 및 Wi-Fi 안정: 60초 지연, 180초 버퍼
                    this.targetDelaySec = 60;
                    this.maxBufferLength = 180;
                    this.fragLoadingTimeout = 16000;
                    this.fragLoadingMaxRetry = 10;
                } else {
                    // GOOD (일반 모바일 4G 표준)
                    this.targetDelaySec = 65;
                    this.maxBufferLength = 210;
                    this.fragLoadingTimeout = 18000;
                    this.fragLoadingMaxRetry = 12;
                }

                // 4. 동작 중인 HLS 인스턴스에 동적 반영
                if (hls && hls.config) {
                    hls.config.maxBufferLength = this.maxBufferLength;
                    hls.config.fragLoadingTimeOut = this.fragLoadingTimeout;
                    hls.config.fragLoadingMaxRetry = this.fragLoadingMaxRetry;
                }

                // 5. UI 실시간 업데이트
                this.updateUI();
            }

            updateUI(overrideTag, overridePillClass, overrideNetStat, overrideDelay) {
                if (!netTagTextEl || !netTagEl) return;

                let tagText = '';
                let pillClass = 'optimal';
                let netStatText = '';

                if (overrideTag) {
                    tagText = overrideTag;
                    pillClass = overridePillClass || 'optimal';
                    netStatText = overrideNetStat || '';
                } else {
                    const isCell = this.networkType === 'CELLULAR' || this.isMobileDevice;
                    const rttStr = this.rtt > 0 ? `${this.rtt}ms` : '정상';

                    if (this.quality === 'OPTIMAL') {
                        tagText = isCell ? '📶 5G/LTE 최적' : '📶 Wi-Fi 최적';
                        pillClass = 'optimal';
                        netStatText = `NET: ${isCell ? '모바일 초고속' : 'Wi-Fi'} (${rttStr})`;
                    } else if (this.quality === 'GOOD') {
                        tagText = isCell ? '📶 모바일 4G' : '📶 Wi-Fi 양호';
                        pillClass = 'optimal';
                        netStatText = `NET: ${isCell ? '모바일 원활' : 'Wi-Fi'} (${rttStr})`;
                    } else if (this.quality === 'FAIR') {
                        tagText = '📶 전파 변동 감지';
                        pillClass = 'charging';
                        netStatText = `NET: 모바일 지연 (${rttStr})`;
                    } else {
                        tagText = '📶 버퍼 긴급 방어';
                        pillClass = 'low';
                        netStatText = `NET: 신호 취약 (${rttStr})`;
                    }
                }

                netTagTextEl.innerText = tagText;
                netTagEl.className = `net-tag ${pillClass}`;
                if (metaNetStatEl) metaNetStatEl.innerText = netStatText;
                if (metaTargetDelayEl) metaTargetDelayEl.innerText = overrideDelay || `TARGET: -${this.targetDelaySec}s`;
            }
        }

        const adaptiveEngine = new MobileAdaptiveEngine();

        // ──────────────────────────────────────────────────────────
        // 1. 실시간 듀얼 시계 & 편성표 자동 감시
        // ──────────────────────────────────────────────────────────
        function updateClocks() {
            const now = new Date();
            const timeOpt = { hour: '2-digit', minute: '2-digit', hour12: false };
            sydTimeEl.innerText = now.toLocaleTimeString('en-AU', { ...timeOpt, timeZone: 'Australia/Sydney' });
            selTimeEl.innerText = now.toLocaleTimeString('ko-KR', { ...timeOpt, timeZone: 'Asia/Seoul' });

            // 1분마다 KST 시각을 감시하여 프로그램 교체 시간인지 확인
            const seoulDate = getSeoulDate();
            const curMin = seoulDate.getMinutes();
            if (curMin !== lastSeoulCheckMin) {
                lastSeoulCheckMin = curMin;
                if (schedulesCache) {
                    evaluateCurrentProgram(schedulesCache);
                } else {
                    fetchLiveSchedules();
                }
            }
        }
        setInterval(updateClocks, 1000);
        updateClocks();

        function getSeoulDate() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (9 * 3600000)); // KST UTC+9
        }

        // ──────────────────────────────────────────────────────────
        // 2. 공식 MBC 실시간 편성표 연동 (JSONP 기법)
        // ──────────────────────────────────────────────────────────
        function fetchLiveSchedules() {
            return new Promise((resolve, reject) => {
                const cbName = 'mbc_sched_cb_' + Date.now();
                const script = document.createElement('script');
                let handled = false;

                const timer = setTimeout(() => {
                    cleanup();
                    if (!handled) {
                        handled = true;
                        reject(new Error('편성표 타임아웃'));
                    }
                }, 7000);

                function cleanup() {
                    clearTimeout(timer);
                    try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
                    if (script.parentNode) script.parentNode.removeChild(script);
                }

                window[cbName] = function(data) {
                    cleanup();
                    if (handled) return;
                    handled = true;
                    if (Array.isArray(data) && data.length > 0) {
                        schedulesCache = data;
                        evaluateCurrentProgram(data);
                        resolve(data);
                    } else {
                        reject(new Error('편성 데이터 없음'));
                    }
                };

                script.onerror = function() {
                    cleanup();
                    if (!handled) {
                        handled = true;
                        reject(new Error('편성표 로드 실패'));
                    }
                };

                script.src = `https://miniapi.imbc.com/Schedule/schedulelist?channel=sfm&callback=${cbName}&_t=${Date.now()}`;
                document.head.appendChild(script);
            });
        }

        // KST 기준 현재 방송 프로그램 판별
        function evaluateCurrentProgram(schedules) {
            if (!schedules || schedules.length === 0) return;

            const seoul = getSeoulDate();
            const daysMap = ['일', '월', '화', '수', '목', '금', '토'];
            const curDay = daysMap[seoul.getDay()];
            const curHHMM = String(seoul.getHours()).padStart(2, '0') + String(seoul.getMinutes()).padStart(2, '0');
            const curVal = parseInt(curHHMM, 10);

            // MBC 표준FM(STFM) & 오늘 요일 필터
            const todaySTFM = schedules.filter(p => p.Channel === 'STFM' && p.LiveDays === curDay);
            todaySTFM.sort((a, b) => parseInt(a.StartTime, 10) - parseInt(b.StartTime, 10));

            let current = null;
            let next = null;

            for (let i = 0; i < todaySTFM.length; i++) {
                const p = todaySTFM[i];
                const st = parseInt(p.StartTime, 10);
                let et = parseInt(p.EndTime, 10);
                if (et === 0) et = 2400; // 자정 종료

                if (st <= curVal && curVal < et) {
                    current = p;
                    next = todaySTFM[(i + 1) % todaySTFM.length];
                    break;
                }
            }

            if (current) {
                applyProgramMetadata(current, next, curDay);
            }
        }

        // UI 및 MediaSession에 프로그램 정보 적용
        function applyProgramMetadata(cur, next, dayLabel) {
            currentProgramMeta = cur;
            programTitleEl.innerText = cur.ProgramTitle || 'MBC 표준FM';

            // 시간 포맷 (0900 -> 09:00)
            const fmtTime = (t) => {
                if (!t || t.length < 4) return t;
                return `${t.slice(0, 2)}:${t.slice(2, 4)}`;
            };

            progDayEl.innerText = `${dayLabel}요일`;
            progTimeEl.innerText = `${fmtTime(cur.StartTime)} - ${fmtTime(cur.EndTime)}`;

            if (next) {
                nextProgEl.innerText = `다음 방송: ${next.ProgramTitle} (${fmtTime(next.StartTime)})`;
            } else {
                nextProgEl.innerText = 'MBC 라디오 95.9 MHz';
            }

            // 고화질 앨범 커버 반영
            const coverUrl = cur.NewHDPicture || cur.HDPicture || cur.Picture || cur.ThumbnailPicture;
            if (coverUrl) {
                const secureCover = coverUrl.replace('http://', 'https://');
                programCoverEl.src = secureCover;
                programCoverEl.onload = () => {
                    programCoverEl.style.display = 'block';
                    coverPlaceholderEl.style.display = 'none';
                    ambientGlowEl.style.backgroundImage = `url('${secureCover}')`;
                };
            }

            // iOS 잠금화면 & 에어팟 메타데이터 동기화
            updateMediaSessionMetadata(cur.ProgramTitle, coverUrl);
        }

        // ──────────────────────────────────────────────────────────
        // 3. iOS MediaSession API (백그라운드 & 잠금화면 완전 연동)
        // ──────────────────────────────────────────────────────────
        function updateMediaSessionMetadata(title, coverUrl) {
            if (!('mediaSession' in navigator)) return;

            const artworks = [];
            if (coverUrl) {
                artworks.push({ src: coverUrl.replace('http://', 'https://'), sizes: '512x512', type: 'image/jpeg' });
            }
            artworks.push({ src: 'https://i.ibb.co/hR8Nf8x/mbc-icon.png', sizes: '512x512', type: 'image/png' });

            navigator.mediaSession.metadata = new MediaMetadata({
                title: title || 'MBC 표준FM (95.9MHz)',
                artist: 'MBC 스마트라디오 mini',
                album: '호주 LIVE (버퍼 세이프)',
                artwork: artworks
            });

            navigator.mediaSession.setActionHandler('play', () => startPlayback(false));
            navigator.mediaSession.setActionHandler('pause', () => pausePlayback());
            navigator.mediaSession.setActionHandler('stop', () => pausePlayback());
        }

        // ──────────────────────────────────────────────────────────
        // 4. 공식 실시간 스트림 URL 발급 (JSONP 기법)
        // ──────────────────────────────────────────────────────────
        function requestOfficialStreamUrl() {
            return new Promise((resolve, reject) => {
                const cb = 'mbc_stream_cb_' + Date.now();
                const script = document.createElement('script');
                let done = false;

                const timer = setTimeout(() => {
                    cleanup();
                    if (!done) {
                        done = true;
                        reject(new Error('스트림 API 시간 초과'));
                    }
                }, 6000);

                function cleanup() {
                    clearTimeout(timer);
                    try { delete window[cb]; } catch (e) { window[cb] = undefined; }
                    if (script.parentNode) script.parentNode.removeChild(script);
                }

                window[cb] = function(data) {
                    cleanup();
                    if (done) return;
                    done = true;
                    if (data && data.AACLiveURL) {
                        resolve(data.AACLiveURL);
                    } else {
                        reject(new Error('유효하지 않은 스트림 응답'));
                    }
                };

                script.onerror = function() {
                    cleanup();
                    if (!done) {
                        done = true;
                        reject(new Error('스트림 스크립트 에러'));
                    }
                };

                script.src = `https://sminiplay.imbc.com/aacplay.ashx?agent=webapp&channel=sfm&callback=${cb}&_t=${Date.now()}`;
                document.head.appendChild(script);
            });
        }

        // ──────────────────────────────────────────────────────────
        // 5. 버퍼 초수 계산 & 게이지 갱신
        // ──────────────────────────────────────────────────────────
        function getBufferSeconds() {
            if (!audio || !audio.buffered || audio.buffered.length === 0) return 0;
            const cur = audio.currentTime;
            for (let i = 0; i < audio.buffered.length; i++) {
                const s = audio.buffered.start(i);
                const e = audio.buffered.end(i);
                if (cur >= s - 0.5 && cur <= e + 0.5) {
                    return Math.max(0, e - cur);
                }
            }
            const lastEnd = audio.buffered.end(audio.buffered.length - 1);
            if (lastEnd > cur) return Math.max(0, lastEnd - cur);
            return 0;
        }

        function updateBufferGauge() {
            const sec = Math.round(getBufferSeconds());
            bufTextEl.innerText = `${sec}s`;

            // 최대 90초 기준 게이지 바 비율 (0~100%)
            const pct = Math.min(100, Math.round((sec / 90) * 100));
            gaugeBarEl.style.width = `${pct}%`;

            bufPillEl.className = 'buf-pill';
            if (sec >= 20) {
                bufPillEl.classList.add('pill-safe');
                bufPillEl.innerText = '안전 확보';
                gaugeBarEl.style.background = 'var(--accent-safe)';
            } else if (sec >= 6) {
                bufPillEl.classList.add('pill-charging');
                bufPillEl.innerText = '사전 충전';
                gaugeBarEl.style.background = 'var(--accent-charging)';
            } else {
                bufPillEl.classList.add('pill-low');
                bufPillEl.innerText = isLivePlaying ? '버퍼 부족' : '대기';
                gaugeBarEl.style.background = 'var(--accent-live)';
            }
        }

        // ──────────────────────────────────────────────────────────
        // 6. 스트림 연결 및 초특급 지연 버퍼링 로직
        // ──────────────────────────────────────────────────────────
        function cleanAudioResources() {
            if (hls) {
                try { hls.destroy(); } catch (e) {}
                hls = null;
            }
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
            isLivePlaying = false;
            initialBufferSeek = false;
            stallCounter = 0;
            lastAudioPosition = -1;
            setButtonState('idle');
            appViewport.classList.remove('is-playing');
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
        }

        async function initStream(forceRefresh = false) {
            cleanAudioResources();
            if (!userWantsPlay) return;

            setButtonState('loading');
            setStatus('공식 보안 스트림 토큰 발급 중...', 'warn');
            debugText.innerText = 'Fetching MBC token...';

            let targetStreamUrl = null;
            try {
                targetStreamUrl = await requestOfficialStreamUrl();
                debugText.innerText = 'Official token ready!';
            } catch (err) {
                debugText.innerText = `Using backup stream #${backupStreamIndex + 1}`;
                targetStreamUrl = BACKUP_STREAMS[backupStreamIndex % BACKUP_STREAMS.length];
            }

            setStatus('대용량 버퍼 충전 및 연결 중...', 'warn');

            // HLS.js 지원 환경
            if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                startHlsEngine(targetStreamUrl);
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                // iOS Safari 네이티브 HLS 환경
                startNativeHlsEngine(targetStreamUrl);
            } else {
                setStatus('HLS 재생을 지원하지 않는 브라우저입니다.', 'error');
            }
        }

        function startHlsEngine(streamUrl) {
            adaptiveEngine.assessNetwork();

            hls = new Hls({
                // 모바일 통신 상태에 따른 적응형 버퍼 및 지연 타깃 적용
                liveSyncDurationCount:       Math.max(16, Math.round(adaptiveEngine.targetDelaySec / 3.5)),
                liveMaxLatencyDurationCount: Math.max(26, Math.round(adaptiveEngine.targetDelaySec / 2.2)),
                maxBufferLength:            adaptiveEngine.maxBufferLength,
                maxMaxBufferLength:         adaptiveEngine.maxBufferLength + 120,
                backBufferLength:            20,  // 지나간 버퍼 메모리 해제
                maxBufferSize:       50 * 1024 * 1024,
                startFragPrefetch:          true,
                lowLatencyMode:            false,
                manifestLoadingTimeOut:    18000,
                fragLoadingTimeOut:        adaptiveEngine.fragLoadingTimeout,
                fragLoadingMaxRetry:       adaptiveEngine.fragLoadingMaxRetry
            });

            hls.loadSource(streamUrl);
            hls.attachMedia(audio);

            // 실시간 세그먼트 전송 통계 수신 -> 모바일 대역폭 & RTT 실측
            hls.on(Hls.Events.FRAG_LOADED, (_, data) => {
                if (data && data.stats) {
                    adaptiveEngine.recordFragStats(data.stats);
                }
            });

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                debugText.innerText = 'Manifest ready. Buffer priming...';
                setTimeout(() => {
                    if (userWantsPlay) audio.play().catch(() => {});
                }, 800);
            });

            hls.on(Hls.Events.ERROR, (_, data) => {
                if (!userWantsPlay || !data.fatal) return;
                debugText.innerText = `HLS error: ${data.details}`;
                if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    hls.recoverMediaError();
                } else if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    // 모바일 핸드오버나 일시적 연결 실패 시 신속 복구 시도
                    debugText.innerText = 'Network error → attempting quick load recovery';
                    try { hls.startLoad(); } catch (e) {}
                    setTimeout(() => { if (userWantsPlay) initStream(true); }, 2000);
                } else {
                    switchBackupSource();
                }
            });
        }

        function startNativeHlsEngine(streamUrl) {
            audio.src = streamUrl;
            audio.load();

            // iOS Safari: 메타데이터 로드 시 모바일 적응형 지연 지점으로 이동하여 전방 버퍼 확보
            const applySafeOffset = () => {
                if (initialBufferSeek) return;
                try {
                    if (audio.seekable && audio.seekable.length > 0) {
                        const end = audio.seekable.end(0);
                        const start = audio.seekable.start(0);
                        const target = Math.max(start, end - adaptiveEngine.targetDelaySec);
                        if (end - start > 15 && target < end - 10) {
                            audio.currentTime = target;
                            initialBufferSeek = true;
                            debugText.innerText = `iOS Safe Margin Primed (-${Math.round(end - target)}s)`;
                        }
                    }
                } catch (e) {}
            };

            audio.addEventListener('loadedmetadata', applySafeOffset, { once: true });
            audio.addEventListener('canplay', applySafeOffset, { once: true });

            audio.play().then(() => {
                setTimeout(applySafeOffset, 1200);
            }).catch(() => {});
        }

        function switchBackupSource() {
            backupStreamIndex++;
            setStatus('예비 서버로 전환 중...', 'warn');
            setTimeout(() => {
                if (userWantsPlay) initStream(true);
            }, 1000);
        }

        function jumpToSafeMargin() {
            try {
                if (hls && hls.liveSyncPosition && isFinite(hls.liveSyncPosition)) {
                    audio.currentTime = hls.liveSyncPosition;
                } else if (audio.seekable && audio.seekable.length > 0) {
                    const end = audio.seekable.end(0);
                    const start = audio.seekable.start(0);
                    audio.currentTime = Math.max(start, end - adaptiveEngine.targetDelaySec);
                }
                audio.play().catch(() => {});
            } catch (e) {
                initStream(true);
            }
        }

        // ──────────────────────────────────────────────────────────
        // 7. 재생 제어 및 원클릭 즉각 복구 (핵심 사용자 요청)
        // ──────────────────────────────────────────────────────────
        function startPlayback(force = false) {
            userWantsPlay = true;
            if (force || audio.paused || !isLivePlaying) {
                initStream(force);
            } else {
                audio.play().catch(() => initStream(true));
            }
        }

        function pausePlayback() {
            userWantsPlay = false;
            cleanAudioResources();
            setStatus('일시 정지됨', 'idle');
            updateBufferGauge();
        }

        // 플레이 버튼 클릭 시: 끊겼거나 멈췄으면 즉시 재연결 & 재생!
        playBtn.onclick = () => {
            const isCurrentlyPlaying = !audio.paused && !audio.ended && isLivePlaying;
            if (isCurrentlyPlaying) {
                pausePlayback();
            } else {
                // 끊겼거나 버퍼링 중이면 즉시 새 스트림을 열어 강제 재생
                startPlayback(true);
            }
        };

        syncBtn.onclick = () => {
            setStatus('스트림 & 편성표 완전 동기화...', 'warn');
            fetchLiveSchedules().catch(() => {});
            userWantsPlay = true;
            initStream(true);
        };

        reloadScheduleBtn.onclick = () => {
            setStatus('편성표 업데이트 중...', 'warn');
            fetchLiveSchedules().then(() => {
                setStatus('최신 편성표 동기화 완료', 'safe');
            }).catch(() => {
                setStatus('편성표 수신 실패 (네트워크 확인)', 'error');
            });
        };

        volSlider.oninput = (e) => {
            audio.volume = e.target.value;
        };

        // ──────────────────────────────────────────────────────────
        // 8. 오디오 이벤트 & 상태 처리
        // ──────────────────────────────────────────────────────────
        audio.onplaying = () => {
            if (!userWantsPlay) return;
            isLivePlaying = true;
            stallCounter = 0;
            setButtonState('playing');
            appViewport.classList.add('is-playing');
            setStatus('● 실시간 방송 청취 중', 'safe');
            debugText.innerText = 'Live Streaming · Buffer Guard ON';
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
            updateBufferGauge();
        };

        audio.onwaiting = () => {
            if (!userWantsPlay) return;
            setButtonState('loading');
            setStatus('네트워크 버퍼 충전 중...', 'warn');
            updateBufferGauge();
        };

        audio.onstalled = () => {
            if (!userWantsPlay) return;
            debugText.innerText = 'Stalled → safe jump';
            jumpToSafeMargin();
        };

        audio.onerror = () => {
            if (!userWantsPlay) return;
            setStatus('스트림 오류 — 자동 복구 시도...', 'warn');
            setTimeout(() => { if (userWantsPlay) initStream(true); }, 1500);
        };

        // 1초 주기 모니터링: 데이터 및 스톨 감지 + 모바일 네트워크 실시간 평가
        setInterval(() => {
            updateBufferGauge();
            adaptiveEngine.assessNetwork();
            adaptiveEngine.runLightweightPing();

            if (!userWantsPlay) {
                lastTickTime = 0;
                stallCounter = 0;
                return;
            }

            const now = Date.now();
            if (isLivePlaying && !audio.paused) {
                if (lastTickTime > 0) {
                    const dt = (now - lastTickTime) / 1000;
                    totalDataBytes += (128 * 1024 / 8) * dt;
                    if (metaTotalEl) {
                        metaTotalEl.innerText = `DATA: ${(totalDataBytes / (1024 * 1024)).toFixed(1)} MB`;
                    }
                }
                lastTickTime = now;
            } else {
                lastTickTime = 0;
            }

            // 스톨(재생 멈춤) 정밀 감지
            if (isLivePlaying && !audio.paused) {
                if (audio.currentTime === lastAudioPosition) {
                    stallCounter++;
                    if (stallCounter === 4) {
                        debugText.innerText = 'Stall detected → safe buffer jump';
                        jumpToSafeMargin();
                    } else if (stallCounter === 8) {
                        debugText.innerText = 'Stall 8s → refreshing stream';
                        initStream(true);
                    } else if (stallCounter >= 14) {
                        stallCounter = 0;
                        switchBackupSource();
                    }
                } else {
                    stallCounter = 0;
                }
                lastAudioPosition = audio.currentTime;
            }
        }, 1000);

        function setButtonState(state) {
            playBtn.classList.remove('is-loading', 'is-playing');
            if (state === 'loading') playBtn.classList.add('is-loading');
            if (state === 'playing') playBtn.classList.add('is-playing');
        }

        function setStatus(text, type = 'idle') {
            statusCaption.innerText = text;
            statusCaption.className = 'status-caption ' + (type === 'safe' ? 'safe' : type === 'warn' ? 'warn' : type === 'error' ? 'error' : '');
        }

        // 초기 편성표 로드
        fetchLiveSchedules().catch(() => {
            programTitleEl.innerText = 'MBC 표준FM (95.9MHz)';
            progTimeEl.innerText = '실시간 스트리밍';
        });
    });
    </script>
</body>
</html>
