<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MBC 라디오">
    <meta name="theme-color" content="#0a0b0e">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://minisw.imbc.com" crossorigin>
    <link rel="preconnect" href="https://minisa.imbc.com" crossorigin>
    <link rel="preconnect" href="https://minisp.imbc.com" crossorigin>
    <link rel="preconnect" href="https://sminiplay.imbc.com">
    <link rel="preconnect" href="https://miniapi.imbc.com">
    <link rel="preconnect" href="https://img.imbc.com">
    <title>MBC 표준FM LIVE</title>
    <style>
        :root {
            --bg-base: #0c0d10;
            --surface-panel: rgba(22, 24, 29, 0.72);
            --surface-border: rgba(255, 255, 255, 0.08);
            --surface-highlight: rgba(255, 255, 255, 0.04);
            --text-primary: #f5f6f8;
            --text-secondary: #8e93a0;
            --text-tertiary: #565a66;
            --accent-live: #ff3b30;
            --accent-active: #ffffff;
            --accent-safe: #34c759;
            --accent-charging: #ff9f0a;
            --radius-main: 32px;
        }

        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-base);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Pretendard", "Helvetica Neue", sans-serif;
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }

        /* ── 동적 앰비언트 배경 (현재 프로그램 커버 아트 블러) ── */
        .ambient-glow-wrapper {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .ambient-glow {
            position: absolute;
            top: -20%; left: -20%;
            width: 140%; height: 140%;
            background-size: cover;
            background-position: center;
            filter: blur(85px) saturate(140%) brightness(0.28);
            transform: translateZ(0);
            transition: opacity 1.2s ease;
            opacity: 0.65;
        }

        .ambient-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 35%, transparent 20%, rgba(12, 13, 16, 0.85) 85%);
        }

        /* ── 메인 컨테이너 ── */
        .app-viewport {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: calc(env(safe-area-inset-top) + 16px) 24px calc(env(safe-area-inset-bottom) + 20px);
            max-width: 440px;
            margin: 0 auto;
        }

        /* ── 상단 메타 헤더 ── */
        .top-nav {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 6px;
        }

        .station-brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-badge {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.6px;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .station-freq {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: -0.2px;
        }

        .live-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--accent-live);
            letter-spacing: 0.8px;
            background: rgba(255, 59, 48, 0.12);
            border: 1px solid rgba(255, 59, 48, 0.25);
            padding: 3px 9px;
            border-radius: 20px;
        }

        .live-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background-color: var(--accent-live);
            box-shadow: 0 0 8px rgba(255, 59, 48, 0.8);
        }

        /* ── 듀얼 시계 인디케이터 (정밀 계측형) ── */
        .world-clock-bar {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            font-size: 0.74rem;
            color: var(--text-tertiary);
            margin: 8px 0 16px;
            letter-spacing: 0.3px;
        }

        .clock-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clock-label {
            font-weight: 600;
            opacity: 0.75;
            font-size: 0.65rem;
        }

        .clock-val {
            color: var(--text-secondary);
            font-variant-numeric: tabular-nums;
            font-weight: 600;
            font-size: 0.78rem;
        }

        .clock-sep {
            color: var(--surface-border);
            font-size: 0.6rem;
        }

        /* ── 프로그램 앨범 커버 ── */
        .cover-section {
            position: relative;
            width: 230px;
            height: 230px;
            margin: 4px auto 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .cover-art-box {
            width: 100%;
            height: 100%;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            background: #191b20;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.75), 0 0 0 1px rgba(255, 255, 255, 0.04);
            transition: transform 0.4s cubic-bezier(0.2, 0.9, 0.3, 1), box-shadow 0.4s ease;
        }

        .app-viewport.is-playing .cover-art-box {
            transform: scale(1.02);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.85), 0 0 0 1px rgba(255, 255, 255, 0.12);
        }

        .cover-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 0.5s ease;
        }

        .cover-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background: linear-gradient(180deg, #1f2229 0%, #15171c 100%);
            color: var(--text-tertiary);
        }

        .cover-placeholder-logo {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: rgba(255, 255, 255, 0.2);
        }

        /* ── 온에어 프로그램 메타 정보 ── */
        .program-info {
            width: 100%;
            text-align: center;
            padding: 0 12px;
            margin-bottom: 14px;
        }

        .program-title {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.4px;
            margin: 0 0 6px;
            line-height: 1.25;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .program-time-wrap {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .prog-day {
            background: rgba(255, 255, 255, 0.07);
            padding: 1px 6px;
            border-radius: 4px;
            font-size: 0.68rem;
            color: var(--text-tertiary);
        }

        .next-program-preview {
            margin-top: 6px;
            font-size: 0.72rem;
            color: var(--text-tertiary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── 버퍼 상태 게이지 (슬릭 인디케이터 & 모바일 적응형 네트워크) ── */
        .buffer-monitor {
            width: 100%;
            background: var(--surface-panel);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--surface-border);
            border-radius: 18px;
            padding: 12px 16px;
            margin-bottom: 20px;
        }

        .buffer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            margin-bottom: 8px;
        }

        .buf-title-group {
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .buf-title {
            color: var(--text-tertiary);
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .net-tag {
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            padding: 2px 7px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.3s ease;
        }

        .net-tag.optimal {
            color: var(--accent-safe);
            border-color: rgba(52, 199, 89, 0.35);
            background: rgba(52, 199, 89, 0.12);
        }

        .net-tag.charging {
            color: var(--accent-charging);
            border-color: rgba(255, 159, 10, 0.35);
            background: rgba(255, 159, 10, 0.12);
        }

        .net-tag.low {
            color: var(--accent-live);
            border-color: rgba(255, 59, 48, 0.35);
            background: rgba(255, 59, 48, 0.12);
        }

        .net-dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: currentColor;
        }

        .buf-stats {
            display: flex;
            align-items: center;
            gap: 6px;
            font-variant-numeric: tabular-nums;
        }

        .buf-sec {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 0.8rem;
        }

        .buf-pill {
            font-size: 0.62rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
            letter-spacing: 0.3px;
        }

        .pill-safe { background: rgba(52, 199, 89, 0.15); color: var(--accent-safe); }
        .pill-charging { background: rgba(255, 159, 10, 0.15); color: var(--accent-charging); }
        .pill-low { background: rgba(255, 59, 48, 0.15); color: var(--accent-live); }

        .gauge-track {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .gauge-bar {
            height: 100%;
            width: 0%;
            background: var(--text-primary);
            border-radius: 2px;
            transition: width 0.4s ease, background 0.3s;
        }

        .buffer-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.65rem;
            color: var(--text-tertiary);
            margin-top: 8px;
            font-variant-numeric: tabular-nums;
        }

        /* ── 오디오 컨트롤 바 ── */
        .controls-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .main-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 28px;
            width: 100%;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            width: 44px;
            height: 44px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .icon-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.08);
            color: var(--text-primary);
        }

        /* ── 메인 재생 버튼 (솔리드 미니멀 하드웨어 감성) ── */
        .play-trigger {
            width: 76px;
            height: 76px;
            border-radius: 50%;
            background: #ffffff;
            border: none;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.8);
            transition: transform 0.18s cubic-bezier(0.2, 0.8, 0.2, 1), background-color 0.2s, box-shadow 0.2s;
            position: relative;
        }

        .play-trigger:active {
            transform: scale(0.92);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        .play-glyph {
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-left: 17px solid #000000;
            margin-left: 4px;
            transition: opacity 0.2s;
        }

        .pause-glyph {
            display: none;
            width: 18px;
            height: 20px;
            gap: 5px;
        }

        .pause-glyph::before,
        .pause-glyph::after {
            content: '';
            flex: 1;
            background: #000000;
            border-radius: 2px;
        }

        .spinner-ring {
            display: none;
            width: 24px;
            height: 24px;
            border: 2px solid rgba(0, 0, 0, 0.18);
            border-top-color: #000000;
            border-radius: 50%;
            animation: spin-loop 0.7s linear infinite;
        }

        @keyframes spin-loop {
            to { transform: rotate(360deg); }
        }

        /* 버튼 상태 */
        .play-trigger.is-loading .play-glyph { display: none; }
        .play-trigger.is-loading .pause-glyph { display: none; }
        .play-trigger.is-loading .spinner-ring { display: block; }

        .play-trigger.is-playing .play-glyph { display: none; }
        .play-trigger.is-playing .pause-glyph { display: flex; }

        /* ── 볼륨 슬라이더 (정밀 트랙) ── */
        .volume-bar-wrap {
            width: 100%;
            max-width: 260px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .vol-icon {
            font-size: 0.8rem;
            color: var(--text-tertiary);
        }

        .vol-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 3px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 2px;
            outline: none;
        }

        .vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        /* ── 상태 피드백 메시지 ── */
        .status-caption {
            font-size: 0.74rem;
            font-weight: 500;
            color: var(--text-tertiary);
            min-height: 1rem;
            text-align: center;
            transition: color 0.3s;
        }

        .status-caption.safe { color: var(--accent-safe); }
        .status-caption.warn { color: var(--accent-charging); }
        .status-caption.error { color: var(--accent-live); }

        /* ── 디버그/버전 푸터 ── */
        .footer-debug {
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <!-- 동적 앰비언트 백드롭 -->
    <div class="ambient-glow-wrapper">
        <div class="ambient-glow" id="ambient-glow"></div>
        <div class="ambient-overlay"></div>
    </div>

    <div class="app-viewport" id="app-viewport">
        <!-- 1. 상단 바 -->
        <header class="top-nav">
            <div class="station-brand">
                <span class="brand-badge">MBC</span>
                <span class="station-freq">표준FM 95.9</span>
            </div>
            <div class="live-tag">
                <span class="live-dot"></span>
                <span>ON AIR</span>
            </div>
        </header>

        <!-- 2. 시계 인디케이터 (시드니 / 서울) -->
        <div class="world-clock-bar">
            <div class="clock-item">
                <span class="clock-label">SYDNEY</span>
                <span class="clock-val" id="syd-time">--:--</span>
            </div>
            <span class="clock-sep">·</span>
            <div class="clock-item">
                <span class="clock-label">SEOUL</span>
                <span class="clock-val" id="sel-time">--:--</span>
            </div>
        </div>

        <!-- 3. 현재 프로그램 앨범 커버 아트 -->
        <section class="cover-section">
            <div class="cover-art-box">
                <div class="cover-placeholder" id="cover-placeholder">
                    <span class="cover-placeholder-logo">MBC</span>
                    <span style="font-size:0.75rem; letter-spacing:0.5px;">스마트라디오 mini</span>
                </div>
                <img id="program-cover" class="cover-img" style="display:none;" alt="프로그램 앨범 아트">
            </div>
        </section>

        <!-- 4. 실시간 프로그램 타이틀 & 편성 정보 -->
        <div class="program-info">
            <h1 class="program-title" id="program-title">MBC 표준FM 라이브</h1>
            <div class="program-time-wrap">
                <span class="prog-day" id="prog-day">LIVE</span>
                <span id="prog-time">편성표 동기화 중...</span>
            </div>
            <div class="next-program-preview" id="next-prog">다음 방송 준비 중</div>
        </div>

        <!-- 5. 버퍼 모니터 게이지 바 (모바일 적응형 네트워크) -->
        <div class="buffer-monitor">
            <div class="buffer-header">
                <div class="buf-title-group">
                    <span class="buf-title">BUFFER RESERVE</span>
                    <span class="net-tag optimal" id="net-tag">
                        <span class="net-dot"></span>
                        <span id="net-tag-text">모바일 오토</span>
                    </span>
                </div>
                <div class="buf-stats">
                    <span class="buf-sec" id="buf-text">0s</span>
                    <span class="buf-pill pill-low" id="buf-pill">대기</span>
                </div>
            </div>
            <div class="gauge-track">
                <div class="gauge-bar" id="gauge-bar"></div>
            </div>
            <div class="buffer-meta-row">
                <span id="meta-net-stat">NET: 모바일 4G/5G</span>
                <span id="meta-target-delay">TARGET: -60s</span>
                <span id="meta-total">DATA: 0.0 MB</span>
            </div>
        </div>

        <!-- 6. 메인 컨트롤 -->
        <div class="controls-panel">
            <div class="main-controls">
                <button class="icon-btn" id="sync-btn" title="스트림 및 편성표 완전 새로고침">🔄</button>
                
                <button class="play-trigger" id="play-btn" title="재생 / 일시정지">
                    <div class="play-glyph"></div>
                    <div class="pause-glyph"></div>
                    <div class="spinner-ring"></div>
                </button>

                <button class="icon-btn" id="reload-schedule-btn" title="편성표 다시 불러오기">📻</button>
            </div>

            <div class="volume-bar-wrap">
                <span class="vol-icon">🔈</span>
                <input type="range" class="vol-slider" id="vol-slider" min="0" max="1" step="0.01" value="1">
                <span class="vol-icon">🔊</span>
            </div>

            <div class="status-caption" id="status-caption">재생 버튼을 탭하여 청취하세요</div>
        </div>

        <div class="footer-debug" id="debug-text">호주 모바일 딥 버퍼 & 스마트 자동 복구 가드 (v2.1.0) · Australia Edition</div>
    </div>

    <!-- 백그라운드 오디오 엘리먼트 -->
    <audio id="audio" playsinline webkit-playsinline preload="auto"></audio>

    <!-- HLS.js 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // [기기 환경 판별] iOS 기기(iPhone/iPad) vs 안드로이드/기타
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || 
                      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        // [iOS 16.4+ 필수] 백그라운드 화면 잠금/스크린세이버 상태에서도 오디오가 절대 꺼지지 않도록 선언
        if ('audioSession' in navigator) {
            try {
                navigator.audioSession.type = 'playback';
            } catch (e) {}
        }

        // DOM 엘리먼트 참조
        const audio             = document.getElementById('audio');
        const playBtn           = document.getElementById('play-btn');
        const syncBtn           = document.getElementById('sync-btn');
        const reloadScheduleBtn = document.getElementById('reload-schedule-btn');
        const volSlider         = document.getElementById('vol-slider');
        const statusCaption     = document.getElementById('status-caption');
        const debugText         = document.getElementById('debug-text');
        const appViewport       = document.getElementById('app-viewport');

        const sydTimeEl         = document.getElementById('syd-time');
        const selTimeEl         = document.getElementById('sel-time');

        const programTitleEl    = document.getElementById('program-title');
        const progDayEl         = document.getElementById('prog-day');
        const progTimeEl        = document.getElementById('prog-time');
        const nextProgEl        = document.getElementById('next-prog');
        const programCoverEl    = document.getElementById('program-cover');
        const coverPlaceholderEl= document.getElementById('cover-placeholder');
        const ambientGlowEl     = document.getElementById('ambient-glow');

        const bufTextEl         = document.getElementById('buf-text');
        const bufPillEl         = document.getElementById('buf-pill');
        const gaugeBarEl        = document.getElementById('gauge-bar');
        const netTagEl          = document.getElementById('net-tag');
        const netTagTextEl      = document.getElementById('net-tag-text');
        const metaNetStatEl     = document.getElementById('meta-net-stat');
        const metaTargetDelayEl = document.getElementById('meta-target-delay');
        const metaTotalEl       = document.getElementById('meta-total');

        // 상태 변수
        let hls                 = null;
        let userWantsPlay       = false;
        let isLivePlaying       = false;
        let isInitializing      = false;
        let schedulesCache      = null;
        let currentProgramMeta  = null;
        let lastSeoulCheckMin   = -1;
        let lastStreamUrl       = null;
        let wakeLockSentinel    = null;

        // 버퍼링 및 통계
        let totalDataBytes      = 0;
        let lastTickTime        = 0;
        let lastAudioPosition   = -1;
        let stallCounter        = 0;
        let initialBufferSeek   = false;
        let lastBgKeepAliveTime = 0;

        // [v2.1.0] 음영지역(터널, 엘리베이터) 무인 자동 재개(Zero-Touch Auto-Resume) 가디언
        let isDeadZoneStandby   = false;
        let deadZoneInterval    = null;
        let isProbingNetwork    = false;

        // ──────────────────────────────────────────────────────────
        // [v2.0.0 핵심 해결책 1] 공식 MBC 3중 멀티 CDN 클러스터 & 타임시프트 딥 윈도우 확장기
        //  - 원인: MBC 기본 chunklist.m3u8은 세그먼트 5개(약 15초)만 노출하여
        //          일반 플레이어로는 절대 12초 이상 선행 버퍼링이 불가능했음.
        //  - 해결: MBC 서버(minisw/minisa/minisp)가 실제로는 과거 50개 이상(약 150초)의
        //          media_XXXXX.aac 세그먼트를 보관 중임을 검증하여,
        //          플레이리스트 수신 시 과거 38개 세그먼트(약 114초)를 동적으로 복원/결합해
        //          총 43개 세그먼트(약 129초) 윈도우로 확장 -> 재생 즉시 65~95초 대용량 버퍼 고속 충전!
        // ──────────────────────────────────────────────────────────
        const MBC_CDN_HOSTS = [
            'minisw.imbc.com', // 1순위: 공식 스마트라디오 WebApp CDN 클러스터
            'minisa.imbc.com', // 2순위: 공식 모바일/안드로이드 전용 CDN 클러스터
            'minisp.imbc.com'  // 3순위: 공식 PC mini 전용 CDN 클러스터
        ];
        let activeCdnIndex = 0;
        const segmentDurations = new Map();
        const HISTORY_SEGMENTS_COUNT = 38; // 과거 38개(~114초) + 현재 5개(~15초) = 약 129초 딥 윈도우

        function rewriteMbcCdnHost(url, hostIdx) {
            if (!url) return url;
            const targetHost = MBC_CDN_HOSTS[hostIdx % MBC_CDN_HOSTS.length];
            return url.replace(/https:\/\/minis[wpa]\.imbc\.com/i, `https://${targetHost}`);
        }

        function expandChunklistM3u8(m3u8Text) {
            if (!m3u8Text || !m3u8Text.includes('#EXTINF:') || !m3u8Text.includes('media_')) {
                return m3u8Text;
            }

            const lines = m3u8Text.split(/\r?\n/);
            const headerLines = [];
            const currentSegs = [];
            let pendingDur = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                if (line.startsWith('#EXT-X-MEDIA-SEQUENCE:')) {
                    continue; // 확장된 시작 시퀀스 번호로 재계산하여 삽입
                }
                if (line.startsWith('#EXTINF:')) {
                    const durMatch = line.match(/#EXTINF:([0-9.]+)/);
                    pendingDur = durMatch ? parseFloat(durMatch[1]) : 3.0;
                    continue;
                }
                if (!line.startsWith('#')) {
                    const seqMatch = line.match(/media_(\d+)\.aac/);
                    if (seqMatch && pendingDur !== null) {
                        const seq = parseInt(seqMatch[1], 10);
                        currentSegs.push({ seq, dur: pendingDur, uri: line });
                        segmentDurations.set(seq, pendingDur);
                    }
                    pendingDur = null;
                    continue;
                }
                headerLines.push(line);
            }

            if (currentSegs.length === 0) return m3u8Text;

            const firstSeq = currentSegs[0].seq;
            const firstDur = currentSegs[0].dur;
            const startSeq = Math.max(1, firstSeq - HISTORY_SEGMENTS_COUNT);

            // 오래된 세그먼트 길이 캐시 정리 (메모리 누수 방지)
            if (segmentDurations.size > 320) {
                for (const k of segmentDurations.keys()) {
                    if (k < startSeq - 40) segmentDurations.delete(k);
                }
            }

            const out = [];
            for (const h of headerLines) {
                out.push(h);
                if (h.startsWith('#EXT-X-TARGETDURATION:')) {
                    out.push(`#EXT-X-MEDIA-SEQUENCE:${startSeq}`);
                }
            }
            if (!out.some(l => l.startsWith('#EXT-X-MEDIA-SEQUENCE:'))) {
                out.push(`#EXT-X-MEDIA-SEQUENCE:${startSeq}`);
            }

            // 서버에 살아있는 과거 38개 세그먼트(약 114초 분량)를 앞에 결합
            for (let s = startSeq; s < firstSeq; s++) {
                let dur = segmentDurations.get(s);
                if (!dur) {
                    const diff = firstSeq - s;
                    const firstIsShort = firstDur < 3.0;
                    if (diff % 2 === 1) {
                        dur = firstIsShort ? 3.065 : 2.926;
                    } else {
                        dur = firstIsShort ? 2.926 : 3.065;
                    }
                    segmentDurations.set(s, dur);
                }
                out.push(`#EXTINF:${dur.toFixed(3)},`);
                out.push(`media_${s}.aac`);
            }

            // 현재 서버가 내려준 최신 5개 세그먼트 결합
            for (const seg of currentSegs) {
                out.push(`#EXTINF:${seg.dur.toFixed(3)},`);
                out.push(seg.uri);
            }

            return out.join('\n') + '\n';
        }

        // HLS.js 커스텀 멀티 CDN 무중단 페일오버 & 딥 버퍼 로더
        function createMultiCdnLoaderClass() {
            if (typeof Hls === 'undefined' || !Hls.DefaultConfig || !Hls.DefaultConfig.loader) return null;
            const BaseLoader = Hls.DefaultConfig.loader;

            return class MultiCdnDeepBufferLoader {
                constructor(hlsConfig) {
                    this.hlsConfig = hlsConfig;
                    this.innerLoader = new BaseLoader(hlsConfig);
                    this.aborted = false;
                }
                get stats() {
                    return this.innerLoader ? this.innerLoader.stats : null;
                }
                get context() {
                    return this.innerLoader ? this.innerLoader.context : null;
                }
                destroy() {
                    this.aborted = true;
                    if (this.innerLoader) {
                        try { this.innerLoader.destroy(); } catch (e) {}
                    }
                }
                abort() {
                    this.aborted = true;
                    if (this.innerLoader) {
                        try { this.innerLoader.abort(); } catch (e) {}
                    }
                }
                load(context, config, callbacks) {
                    this.aborted = false;
                    this._attemptLoad(context, config, callbacks, 0);
                }
                _attemptLoad(context, config, callbacks, attempt) {
                    if (this.aborted) return;

                    const hostIdx = (activeCdnIndex + attempt) % MBC_CDN_HOSTS.length;
                    context.url = rewriteMbcCdnHost(context.url, hostIdx);

                    if (attempt > 0) {
                        try { this.innerLoader.destroy(); } catch (e) {}
                        this.innerLoader = new BaseLoader(this.hlsConfig);
                    }

                    const isPlaylist = context.url.includes('.m3u8');

                    this.innerLoader.load(context, config, {
                        onSuccess: (response, stats, ctx, networkDetails) => {
                            if (attempt > 0) {
                                activeCdnIndex = hostIdx;
                                debugText.innerText = `Multi-CDN Active: ${MBC_CDN_HOSTS[activeCdnIndex]}`;
                            }
                            if (isPlaylist && typeof response.data === 'string' && response.data.includes('#EXTINF:')) {
                                response.data = expandChunklistM3u8(response.data);
                            } else if (!isPlaylist && response.data) {
                                const byteLen = response.data.byteLength || (stats && stats.total) || 0;
                                adaptiveEngine.recordFragStats(stats, byteLen);
                            }
                            callbacks.onSuccess(response, stats, ctx, networkDetails);
                        },
                        onError: (error, ctx, networkDetails, stats) => {
                            if (!this.aborted && attempt + 1 < MBC_CDN_HOSTS.length) {
                                const nextHost = MBC_CDN_HOSTS[(activeCdnIndex + attempt + 1) % MBC_CDN_HOSTS.length];
                                debugText.innerText = `CDN Reroute → ${nextHost}`;
                                this._attemptLoad(context, config, callbacks, attempt + 1);
                                return;
                            }
                            callbacks.onError(error, ctx, networkDetails, stats);
                        },
                        onTimeout: (stats, ctx, networkDetails) => {
                            if (!this.aborted && attempt + 1 < MBC_CDN_HOSTS.length) {
                                const nextHost = MBC_CDN_HOSTS[(activeCdnIndex + attempt + 1) % MBC_CDN_HOSTS.length];
                                debugText.innerText = `CDN Timeout Reroute → ${nextHost}`;
                                this._attemptLoad(context, config, callbacks, attempt + 1);
                                return;
                            }
                            callbacks.onTimeout(stats, ctx, networkDetails);
                        },
                        onProgress: callbacks.onProgress ? (stats, ctx, data, networkDetails) => {
                            callbacks.onProgress(stats, ctx, data, networkDetails);
                        } : undefined
                    });
                }
            };
        }

        // ──────────────────────────────────────────────────────────
        // [v2.0.0] 모바일 적응형 네트워크 엔진 (Mobile Adaptive Guard)
        // ──────────────────────────────────────────────────────────
        class MobileAdaptiveEngine {
            constructor() {
                this.conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                this.isMobileDevice = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 0);
                
                this.networkType = this.isMobileDevice ? 'CELLULAR' : 'AUTO';
                this.quality = 'GOOD';       // 'OPTIMAL' | 'GOOD' | 'FAIR' | 'POOR'
                this.rtt = 0;               // ms
                this.downlink = 0;          // Mbps
                this.effectiveType = '4g';
                
                this.fragHistory = [];
                this.lastSpeedKbps = 256;
                this.lastPingTime = 0;
                
                // 호주 모바일 환경에 최적화된 딥 버퍼링 파라미터 (확장된 129초 윈도우 기반)
                this.targetDelaySec = 68;
                this.maxBufferLength = 150;
                this.fragLoadingTimeout = 14000;
                this.fragLoadingMaxRetry = 14;
                
                this.setupListeners();
                this.assessNetwork();
                this.runLightweightPing();
            }

            setupListeners() {
                if (this.conn) {
                    this.conn.addEventListener('change', () => this.handleConnectionChange());
                }

                window.addEventListener('online', () => {
                    this.assessNetwork();
                    if (isDeadZoneStandby) {
                        resumeFromDeadZone();
                        return;
                    }
                    setStatus('인터넷 재연결 감지 — 버퍼 자동 보충 중', 'safe');
                    if (userWantsPlay) {
                        if (hls && isLivePlaying && getBufferSeconds() > 2) {
                            try { hls.startLoad(); } catch (e) {}
                        } else if (!isLivePlaying || audio.paused) {
                            initStream(true);
                        }
                    }
                });

                window.addEventListener('offline', () => {
                    this.quality = 'POOR';
                    const remainSec = Math.round(getBufferSeconds());
                    if (remainSec > 2) {
                        this.updateUI('📶 오프라인 방어', 'low', 'NET: 일시 단절', `RESERVE: ${remainSec}s`);
                        setStatus(`네트워크 단절 — 확보된 ${remainSec}초 버퍼로 무중단 재생 중`, 'warn');
                    } else {
                        triggerDeadZoneStandby('네트워크 단절');
                    }
                });
            }

            handleConnectionChange() {
                const prevType = this.networkType;
                this.assessNetwork();
                
                if (prevType !== this.networkType) {
                    debugText.innerText = `Network Handover: ${prevType} → ${this.networkType}`;
                    const currentBuf = getBufferSeconds();
                    
                    if (isLivePlaying) {
                        setStatus(`통신망 전환(${this.networkType}) — 딥 버퍼로 무중단 유지`, 'safe');
                        // 기존 버퍼가 충분하면 절대 세션을 끊지 않고 백그라운드 로더만 깨움
                        if (hls && currentBuf >= 4) {
                            try { hls.startLoad(); } catch (e) {}
                        } else if (currentBuf < 2 && audio.paused) {
                            setTimeout(() => {
                                if (userWantsPlay) initStream(true);
                            }, 500);
                        }
                    }
                }
            }

            // HLS.js 세그먼트 전송 통계 실측 수신
            recordFragStats(stats, fallbackBytes = 0) {
                if (!stats || !stats.loading) return;
                const loadDuration = Math.max(1, stats.loading.end - stats.loading.start);
                const bytes = fallbackBytes || stats.total || stats.loaded || 0;
                const speedKbps = Math.round((bytes * 8) / (loadDuration / 1000) / 1024);
                
                if (bytes > 0) {
                    totalDataBytes += bytes;
                    if (metaTotalEl) {
                        metaTotalEl.innerText = `DATA: ${(totalDataBytes / (1024 * 1024)).toFixed(1)} MB`;
                    }
                }

                this.lastSpeedKbps = speedKbps;
                this.fragHistory.push({ time: Date.now(), speed: speedKbps, duration: loadDuration });
                if (this.fragHistory.length > 8) this.fragHistory.shift();

                if (stats.loading.first && stats.loading.first > stats.loading.start) {
                    const estRtt = Math.round(stats.loading.first - stats.loading.start);
                    if (estRtt > 0 && estRtt < 4000) {
                        this.rtt = estRtt;
                    }
                }

                this.assessNetwork();
            }

            // 경량 핑 (30초 주기)
            async runLightweightPing() {
                const now = Date.now();
                if (now - this.lastPingTime < 30000) return;
                this.lastPingTime = now;

                try {
                    const t0 = performance.now();
                    await fetch(`https://miniapi.imbc.com/favicon.ico?_t=${now}`, {
                        method: 'HEAD',
                        mode: 'no-cors',
                        cache: 'no-store'
                    });
                    const t1 = performance.now();
                    const measuredRtt = Math.round(t1 - t0);
                    if (measuredRtt > 0 && measuredRtt < 5000) {
                        this.rtt = measuredRtt;
                        this.assessNetwork();
                    }
                } catch (e) {
                    // 오프라인 등 무시
                }
            }

            // 네트워크 상태 종합 판정 및 모바일 파라미터 자동 조절
            assessNetwork() {
                if (this.conn) {
                    this.effectiveType = this.conn.effectiveType || '4g';
                    this.downlink = this.conn.downlink || 0;
                    if (this.conn.rtt && this.conn.rtt > 0 && this.fragHistory.length === 0) {
                        this.rtt = this.conn.rtt;
                    }

                    if (this.conn.type === 'wifi' || this.conn.type === 'ethernet') {
                        this.networkType = 'WIFI';
                    } else if (this.conn.type === 'cellular') {
                        this.networkType = 'CELLULAR';
                    } else {
                        this.networkType = this.isMobileDevice ? 'CELLULAR' : 'AUTO';
                    }
                } else {
                    this.networkType = this.isMobileDevice ? 'CELLULAR' : 'AUTO';
                }

                const avgSpeed = this.fragHistory.length > 0
                    ? (this.fragHistory.reduce((s, f) => s + f.speed, 0) / this.fragHistory.length)
                    : 1500;

                const currentBuf = getBufferSeconds();

                if (this.effectiveType === '2g' || this.effectiveType === 'slow-2g' || (avgSpeed < 160 && isLivePlaying) || (currentBuf < 8 && isLivePlaying && stallCounter > 2)) {
                    this.quality = 'POOR';
                } else if (this.effectiveType === '3g' || avgSpeed < 450 || this.rtt > 380) {
                    this.quality = 'FAIR';
                } else if (this.rtt < 180 && avgSpeed > 1200) {
                    this.quality = 'OPTIMAL';
                } else {
                    this.quality = 'GOOD';
                }

                // 호주 모바일 셀룰러 특화: 129초 확장 윈도우 안에서 65~92초 선행 버퍼 즉시 확보
                if (this.quality === 'POOR') {
                    this.targetDelaySec = 90;
                    this.maxBufferLength = 180;
                    this.fragLoadingTimeout = 18000;
                    this.fragLoadingMaxRetry = 16;
                } else if (this.quality === 'FAIR') {
                    this.targetDelaySec = 78;
                    this.maxBufferLength = 160;
                    this.fragLoadingTimeout = 15000;
                    this.fragLoadingMaxRetry = 14;
                } else if (this.quality === 'OPTIMAL') {
                    this.targetDelaySec = 65;
                    this.maxBufferLength = 140;
                    this.fragLoadingTimeout = 12000;
                    this.fragLoadingMaxRetry = 12;
                } else {
                    this.targetDelaySec = 72;
                    this.maxBufferLength = 150;
                    this.fragLoadingTimeout = 14000;
                    this.fragLoadingMaxRetry = 14;
                }

                if (hls && hls.config) {
                    hls.config.maxBufferLength = this.maxBufferLength;
                    hls.config.fragLoadingTimeOut = this.fragLoadingTimeout;
                    hls.config.fragLoadingMaxRetry = this.fragLoadingMaxRetry;
                }

                this.updateUI();
            }

            updateUI(overrideTag, overridePillClass, overrideNetStat, overrideDelay) {
                if (!netTagTextEl || !netTagEl) return;

                let tagText = '';
                let pillClass = 'optimal';
                let netStatText = '';

                if (overrideTag) {
                    tagText = overrideTag;
                    pillClass = overridePillClass || 'optimal';
                    netStatText = overrideNetStat || '';
                } else {
                    const isCell = this.networkType === 'CELLULAR' || this.isMobileDevice;
                    const rttStr = this.rtt > 0 ? `${this.rtt}ms` : '정상';

                    if (this.quality === 'OPTIMAL') {
                        tagText = isCell ? '📶 5G/LTE 최적' : '📶 Wi-Fi 최적';
                        pillClass = 'optimal';
                        netStatText = `NET: ${isCell ? '모바일 초고속' : 'Wi-Fi'} (${rttStr})`;
                    } else if (this.quality === 'GOOD') {
                        tagText = isCell ? '📶 모바일 4G' : '📶 Wi-Fi 양호';
                        pillClass = 'optimal';
                        netStatText = `NET: ${isCell ? '모바일 원활' : 'Wi-Fi'} (${rttStr})`;
                    } else if (this.quality === 'FAIR') {
                        tagText = '📶 전파 변동 방어';
                        pillClass = 'charging';
                        netStatText = `NET: 모바일 지연 (${rttStr})`;
                    } else {
                        tagText = '📶 딥 버퍼 방어';
                        pillClass = 'low';
                        netStatText = `NET: 신호 취약 (${rttStr})`;
                    }
                }

                netTagTextEl.innerText = tagText;
                netTagEl.className = `net-tag ${pillClass}`;
                if (metaNetStatEl) metaNetStatEl.innerText = netStatText;
                if (metaTargetDelayEl) metaTargetDelayEl.innerText = overrideDelay || `TARGET: +${this.targetDelaySec}s`;
            }
        }

        const adaptiveEngine = new MobileAdaptiveEngine();

        // ──────────────────────────────────────────────────────────
        // 1. 실시간 듀얼 시계 & 편성표 자동 감시
        // ──────────────────────────────────────────────────────────
        function updateClocks() {
            const now = new Date();
            const timeOpt = { hour: '2-digit', minute: '2-digit', hour12: false };
            sydTimeEl.innerText = now.toLocaleTimeString('en-AU', { ...timeOpt, timeZone: 'Australia/Sydney' });
            selTimeEl.innerText = now.toLocaleTimeString('ko-KR', { ...timeOpt, timeZone: 'Asia/Seoul' });

            // 1분마다 KST 시각을 감시하여 프로그램 교체 시간인지 확인
            const seoulDate = getSeoulDate();
            const curMin = seoulDate.getMinutes();
            if (curMin !== lastSeoulCheckMin) {
                lastSeoulCheckMin = curMin;
                if (schedulesCache) {
                    evaluateCurrentProgram(schedulesCache);
                } else {
                    fetchLiveSchedules().catch(() => {});
                }
            }
        }
        setInterval(updateClocks, 1000);
        updateClocks();

        function getSeoulDate() {
            const now = new Date();
            const utc = now.getTime() + (now.getTimezoneOffset() * 60000);
            return new Date(utc + (9 * 3600000)); // KST UTC+9
        }

        // ──────────────────────────────────────────────────────────
        // 2. 공식 MBC 실시간 편성표 연동 (JSONP 기법)
        // ──────────────────────────────────────────────────────────
        function fetchLiveSchedules() {
            return new Promise((resolve, reject) => {
                const cbName = 'mbc_sched_cb_' + Date.now();
                const script = document.createElement('script');
                let handled = false;

                const timer = setTimeout(() => {
                    cleanup();
                    if (!handled) {
                        handled = true;
                        reject(new Error('편성표 타임아웃'));
                    }
                }, 7000);

                function cleanup() {
                    clearTimeout(timer);
                    try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
                    if (script.parentNode) script.parentNode.removeChild(script);
                }

                window[cbName] = function(data) {
                    cleanup();
                    if (handled) return;
                    handled = true;
                    if (Array.isArray(data) && data.length > 0) {
                        schedulesCache = data;
                        evaluateCurrentProgram(data);
                        resolve(data);
                    } else {
                        reject(new Error('편성 데이터 없음'));
                    }
                };

                script.onerror = function() {
                    cleanup();
                    if (!handled) {
                        handled = true;
                        reject(new Error('편성표 로드 실패'));
                    }
                };

                script.src = `https://miniapi.imbc.com/Schedule/schedulelist?channel=sfm&callback=${cbName}&_t=${Date.now()}`;
                document.head.appendChild(script);
            });
        }

        // KST 기준 현재 방송 프로그램 판별
        function evaluateCurrentProgram(schedules) {
            if (!schedules || schedules.length === 0) return;

            const seoul = getSeoulDate();
            const daysMap = ['일', '월', '화', '수', '목', '금', '토'];
            const curDay = daysMap[seoul.getDay()];
            const curHHMM = String(seoul.getHours()).padStart(2, '0') + String(seoul.getMinutes()).padStart(2, '0');
            const curVal = parseInt(curHHMM, 10);

            const todaySTFM = schedules.filter(p => p.Channel === 'STFM' && p.LiveDays === curDay);
            todaySTFM.sort((a, b) => parseInt(a.StartTime, 10) - parseInt(b.StartTime, 10));

            let current = null;
            let next = null;

            for (let i = 0; i < todaySTFM.length; i++) {
                const p = todaySTFM[i];
                const st = parseInt(p.StartTime, 10);
                let et = parseInt(p.EndTime, 10);
                if (et === 0) et = 2400;

                if (st <= curVal && curVal < et) {
                    current = p;
                    next = todaySTFM[(i + 1) % todaySTFM.length];
                    break;
                }
            }

            if (current) {
                applyProgramMetadata(current, next, curDay);
            }
        }

        // UI 및 MediaSession에 프로그램 정보 적용
        function applyProgramMetadata(cur, next, dayLabel) {
            currentProgramMeta = cur;
            programTitleEl.innerText = cur.ProgramTitle || 'MBC 표준FM';

            const fmtTime = (t) => {
                if (!t || t.length < 4) return t;
                return `${t.slice(0, 2)}:${t.slice(2, 4)}`;
            };

            progDayEl.innerText = `${dayLabel}요일`;
            progTimeEl.innerText = `${fmtTime(cur.StartTime)} - ${fmtTime(cur.EndTime)}`;

            if (next) {
                nextProgEl.innerText = `다음 방송: ${next.ProgramTitle} (${fmtTime(next.StartTime)})`;
            } else {
                nextProgEl.innerText = 'MBC 라디오 95.9 MHz';
            }

            const coverUrl = cur.NewHDPicture || cur.HDPicture || cur.Picture || cur.ThumbnailPicture;
            if (coverUrl) {
                const secureCover = coverUrl.replace('http://', 'https://');
                programCoverEl.src = secureCover;
                programCoverEl.onload = () => {
                    programCoverEl.style.display = 'block';
                    coverPlaceholderEl.style.display = 'none';
                    ambientGlowEl.style.backgroundImage = `url('${secureCover}')`;
                };
            }

            updateMediaSessionMetadata(cur.ProgramTitle, coverUrl);
        }

        // ──────────────────────────────────────────────────────────
        // 3. iOS MediaSession API (백그라운드 & 잠금화면 완전 연동)
        // ──────────────────────────────────────────────────────────
        function updateMediaSessionMetadata(title, coverUrl) {
            if (!('mediaSession' in navigator)) return;

            const artworks = [];
            if (coverUrl) {
                artworks.push({ src: coverUrl.replace('http://', 'https://'), sizes: '512x512', type: 'image/jpeg' });
            }
            artworks.push({ src: 'icon-512.png', sizes: '512x512', type: 'image/png' });

            navigator.mediaSession.metadata = new MediaMetadata({
                title: title || 'MBC 표준FM (95.9MHz)',
                artist: 'MBC 스마트라디오 mini',
                album: '호주 LIVE (딥 버퍼 가드)',
                artwork: artworks
            });

            navigator.mediaSession.setActionHandler('play', () => startPlayback(false));
            navigator.mediaSession.setActionHandler('pause', () => pausePlayback());
            navigator.mediaSession.setActionHandler('stop', () => pausePlayback());
        }

        // 화면 꺼짐 방지 Wake Lock (지원 기기에서 거치 중 네트워크 절전 진입 방지)
        async function requestWakeLock() {
            if (!('wakeLock' in navigator) || document.hidden || !userWantsPlay) return;
            try {
                if (!wakeLockSentinel) {
                    wakeLockSentinel = await navigator.wakeLock.request('screen');
                    wakeLockSentinel.addEventListener('release', () => {
                        wakeLockSentinel = null;
                    });
                }
            } catch (e) {}
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                // 화면이 다시 켜졌을 때 (주머니에서 꺼내거나 화면 잠금 해제)
                requestWakeLock();
                updateBufferGauge();
                if (userWantsPlay) {
                    if (isDeadZoneStandby) {
                        resumeFromDeadZone();
                    } else if (audio.paused && isLivePlaying) {
                        audio.play().catch(() => initStream(true));
                    } else if (hls && isLivePlaying) {
                        try { hls.startLoad(); } catch (e) {}
                    }
                }
            } else {
                // 화면이 꺼지거나 주머니에 들어갔을 때 (스크린세이버/화면잠금)
                if (userWantsPlay && ('mediaSession' in navigator)) {
                    navigator.mediaSession.playbackState = 'playing';
                }
            }
        });

        // ──────────────────────────────────────────────────────────
        // 4. 공식 실시간 스트림 URL 발급 (JSONP 다중 재시도 지원)
        // ──────────────────────────────────────────────────────────
        function requestOfficialStreamUrl(attempt = 1) {
            return new Promise((resolve, reject) => {
                const cb = 'mbc_stream_cb_' + Date.now() + '_' + Math.floor(Math.random() * 1000);
                const script = document.createElement('script');
                let done = false;

                const timer = setTimeout(() => {
                    cleanup();
                    if (!done) {
                        done = true;
                        if (attempt < 2) {
                            requestOfficialStreamUrl(attempt + 1).then(resolve).catch(reject);
                        } else {
                            reject(new Error('스트림 API 시간 초과'));
                        }
                    }
                }, 5500);

                function cleanup() {
                    clearTimeout(timer);
                    try { delete window[cb]; } catch (e) { window[cb] = undefined; }
                    if (script.parentNode) script.parentNode.removeChild(script);
                }

                window[cb] = function(data) {
                    cleanup();
                    if (done) return;
                    done = true;
                    if (data && data.AACLiveURL) {
                        const url = rewriteMbcCdnHost(data.AACLiveURL.replace('http://', 'https://'), activeCdnIndex);
                        lastStreamUrl = url;
                        resolve(url);
                    } else {
                        reject(new Error('유효하지 않은 스트림 응답'));
                    }
                };

                script.onerror = function() {
                    cleanup();
                    if (!done) {
                        done = true;
                        if (attempt < 2) {
                            requestOfficialStreamUrl(attempt + 1).then(resolve).catch(reject);
                        } else {
                            reject(new Error('스트림 스크립트 에러'));
                        }
                    }
                };

                script.src = `https://sminiplay.imbc.com/aacplay.ashx?agent=webapp&channel=sfm&callback=${cb}&_t=${Date.now()}`;
                document.head.appendChild(script);
            });
        }

        // ──────────────────────────────────────────────────────────
        // 5. 버퍼 초수 계산 & 게이지 갱신
        // ──────────────────────────────────────────────────────────
        function getBufferSeconds() {
            if (!audio || !audio.buffered || audio.buffered.length === 0) return 0;
            const cur = audio.currentTime;
            for (let i = 0; i < audio.buffered.length; i++) {
                const s = audio.buffered.start(i);
                const e = audio.buffered.end(i);
                if (cur >= s - 1.0 && cur <= e + 0.5) {
                    return Math.max(0, e - cur);
                }
            }
            const lastEnd = audio.buffered.end(audio.buffered.length - 1);
            if (lastEnd > cur) return Math.max(0, lastEnd - cur);
            return 0;
        }

        function updateBufferGauge() {
            const sec = Math.round(getBufferSeconds());
            bufTextEl.innerText = `${sec}s`;

            // 75초 기준 게이지 바 비율 (0~100%)
            const pct = Math.min(100, Math.round((sec / 75) * 100));
            gaugeBarEl.style.width = `${pct}%`;

            bufPillEl.className = 'buf-pill';
            if (sec >= 18) {
                bufPillEl.classList.add('pill-safe');
                bufPillEl.innerText = sec >= 45 ? '초대용량 안전' : '안전 확보';
                gaugeBarEl.style.background = 'var(--accent-safe)';
            } else if (sec >= 5) {
                bufPillEl.classList.add('pill-charging');
                bufPillEl.innerText = '고속 충전 중';
                gaugeBarEl.style.background = 'var(--accent-charging)';
            } else {
                bufPillEl.classList.add('pill-low');
                bufPillEl.innerText = isLivePlaying ? '버퍼 보충' : '대기';
                gaugeBarEl.style.background = 'var(--accent-live)';
            }
        }

        // 미세 타임스탬프 홀(Micro-Gap) 감지 시 버퍼 손실 없이 즉시 브릿징
        function tryBridgeMicroGap() {
            if (!audio || !audio.buffered || audio.buffered.length === 0) return false;
            const cur = audio.currentTime;
            for (let i = 0; i < audio.buffered.length; i++) {
                const s = audio.buffered.start(i);
                const e = audio.buffered.end(i);
                if (s > cur && s - cur < 4.5 && e - s > 2.0) {
                    audio.currentTime = s + 0.15;
                    debugText.innerText = `Micro-gap bridged (+${(s - cur).toFixed(2)}s)`;
                    audio.play().catch(() => {});
                    return true;
                }
            }
            return false;
        }

        // ──────────────────────────────────────────────────────────
        // 6. 스트림 연결 및 타임시프트 초특급 딥 버퍼링 엔진
        // ──────────────────────────────────────────────────────────
        function cleanAudioResources() {
            if (deadZoneInterval) {
                clearInterval(deadZoneInterval);
                deadZoneInterval = null;
            }
            isDeadZoneStandby = false;
            isProbingNetwork = false;
            if (hls) {
                try { hls.destroy(); } catch (e) {}
                hls = null;
            }
            audio.pause();
            audio.removeAttribute('src');
            while (audio.firstChild) {
                audio.removeChild(audio.firstChild);
            }
            audio.load();
            isLivePlaying = false;
            initialBufferSeek = false;
            stallCounter = 0;
            lastAudioPosition = -1;
            setButtonState('idle');
            appViewport.classList.remove('is-playing');
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'paused';
        }

        async function initStream(forceRefresh = false) {
            if (isInitializing) return;
            isInitializing = true;

            cleanAudioResources();
            if (!userWantsPlay) {
                isInitializing = false;
                return;
            }

            setButtonState('loading');
            setStatus('공식 보안 스트림 토큰 발급 중...', 'warn');
            debugText.innerText = `Connecting via ${MBC_CDN_HOSTS[activeCdnIndex]}...`;

            let targetStreamUrl = null;
            try {
                targetStreamUrl = await requestOfficialStreamUrl();
                debugText.innerText = `Token ready (${MBC_CDN_HOSTS[activeCdnIndex]})`;
            } catch (err) {
                if (lastStreamUrl) {
                    activeCdnIndex = (activeCdnIndex + 1) % MBC_CDN_HOSTS.length;
                    targetStreamUrl = rewriteMbcCdnHost(lastStreamUrl, activeCdnIndex);
                    debugText.innerText = `Using cached token on ${MBC_CDN_HOSTS[activeCdnIndex]}`;
                } else {
                    isInitializing = false;
                    setStatus('네트워크 응답 지연 — 2초 후 자동 재시도...', 'warn');
                    setTimeout(() => { if (userWantsPlay) initStream(true); }, 2000);
                    return;
                }
            }

            isInitializing = false;
            if (!userWantsPlay) return;

            setStatus(isIOS ? 'iOS 네이티브 백그라운드 엔진 연결 중...' : '대용량 딥 버퍼(65~90초) 고속 충전 및 연결 중...', 'warn');
            requestWakeLock();

            if (isIOS && audio.canPlayType('application/vnd.apple.mpegurl')) {
                // [iOS 최우선 엔진] 아이폰/아이패드 환경에서는 Apple Native HLS 엔진을 최우선 구동!
                // Apple OS 커널 데몬(AVPlayer)이 구동되어, 화면이 꺼지거나 스크린세이버/주머니에 넣어도
                // 백그라운드에서 직접 네트워크 세그먼트를 24시간 다운로드하여 끊김 없이 재생 유지!
                startNativeHlsEngine(targetStreamUrl);
            } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
                // [안드로이드 & 데스크톱] 129초 타임시프트 딥 윈도우 확장기로 65~90초 대용량 사전 버퍼 고속 충전!
                startHlsEngine(targetStreamUrl);
            } else if (audio.canPlayType('application/vnd.apple.mpegurl')) {
                startNativeHlsEngine(targetStreamUrl);
            } else {
                setStatus('HLS 재생을 지원하지 않는 브라우저입니다.', 'error');
            }
        }

        function startHlsEngine(streamUrl) {
            adaptiveEngine.assessNetwork();
            const CustomLoader = createMultiCdnLoaderClass();

            hls = new Hls({
                loader:                     CustomLoader || Hls.DefaultConfig.loader,
                enableWorker:               true,
                preferManagedMediaSource:   false, // 표준 MediaSource 우선 사용
                liveSyncDuration:           adaptiveEngine.targetDelaySec,
                liveMaxLatencyDuration:     122,   // 129초 확장 윈도우 안에서 강제 점프 없이 여유 유지
                maxLiveSyncPlaybackRate:    1.0,   // 음정/배속 변화 없이 1.0x 정속 재생 고정
                maxBufferLength:            adaptiveEngine.maxBufferLength,
                maxMaxBufferLength:         210,
                backBufferLength:           25,
                maxBufferSize:              50 * 1024 * 1024,
                maxBufferHole:              0.5,
                nudgeOffset:                0.2,
                nudgeMaxRetry:              10,
                startFragPrefetch:          true,
                lowLatencyMode:             false,
                manifestLoadingTimeOut:     12000,
                manifestLoadingMaxRetry:    6,
                levelLoadingTimeOut:        12000,
                levelLoadingMaxRetry:       6,
                fragLoadingTimeOut:         adaptiveEngine.fragLoadingTimeout,
                fragLoadingMaxRetry:        adaptiveEngine.fragLoadingMaxRetry
            });

            // iPhone iOS Safari ManagedMediaSource 셀룰러 조기 버퍼 차단 방어
            if (typeof hls.pauseBuffering === 'function') {
                const origPauseBuffering = hls.pauseBuffering.bind(hls);
                hls.pauseBuffering = () => {
                    const curBuf = getBufferSeconds();
                    if (curBuf < adaptiveEngine.targetDelaySec + 10) {
                        try { hls.resumeBuffering(); } catch (e) {}
                        return;
                    }
                    origPauseBuffering();
                };
            }

            hls.loadSource(streamUrl);
            hls.attachMedia(audio);

            hls.on(Hls.Events.FRAG_LOADED, () => {
                updateBufferGauge();
            });

            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                debugText.innerText = `Deep Buffer Priming (${MBC_CDN_HOSTS[activeCdnIndex]})...`;
                if (userWantsPlay) {
                    audio.play().catch(() => {
                        setTimeout(() => {
                            if (userWantsPlay) audio.play().catch(() => {});
                        }, 300);
                    });
                }
            });

            hls.on(Hls.Events.ERROR, (_, data) => {
                if (!userWantsPlay) return;

                // 비치명적 버퍼 스톨 에러 시 미세 갭 브릿징 시도
                if (!data.fatal) {
                    if (data.details === Hls.ErrorDetails.BUFFER_STALLED_ERROR) {
                        tryBridgeMicroGap();
                        try { hls.startLoad(); } catch (e) {}
                    }
                    return;
                }

                debugText.innerText = `HLS recovery: ${data.details}`;
                if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
                    hls.recoverMediaError();
                } else if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
                    const remainBuf = getBufferSeconds();
                    activeCdnIndex = (activeCdnIndex + 1) % MBC_CDN_HOSTS.length;
                    debugText.innerText = `Failover → ${MBC_CDN_HOSTS[activeCdnIndex]} (Buf: ${Math.round(remainBuf)}s)`;
                    try { hls.startLoad(); } catch (e) {}

                    if (remainBuf < 2) {
                        setTimeout(() => {
                            if (userWantsPlay && getBufferSeconds() < 2 && (!isLivePlaying || audio.paused)) {
                                if (!navigator.onLine) {
                                    triggerDeadZoneStandby('네트워크 연결 끊김');
                                } else {
                                    initStream(true);
                                }
                            }
                        }, 2500);
                    }
                } else {
                    switchBackupCdn();
                }
            });
        }

        // [iOS Native HLS 엔진] 화면 꺼짐/스크린세이버/주머니 상태에서도 Apple AVPlayer가 백그라운드 24시간 다운로드 보장
        function startNativeHlsEngine(streamUrl) {
            debugText.innerText = `iOS Native Engine · ${MBC_CDN_HOSTS[activeCdnIndex]}`;
            audio.src = streamUrl;
            audio.load();

            const tryPlay = () => {
                if (userWantsPlay) {
                    audio.play().then(() => {
                        isLivePlaying = true;
                        setButtonState('playing');
                        setStatus('● 실시간 방송 청취 중 (iOS 백그라운드 가드 작동)', 'safe');
                        debugText.innerText = `iOS Background Ready · ${MBC_CDN_HOSTS[activeCdnIndex]}`;
                        if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
                    }).catch(err => {
                        debugText.innerText = `iOS Native play retry: ${err.name}`;
                    });
                }
            };

            audio.addEventListener('loadedmetadata', tryPlay, { once: true });
            audio.addEventListener('canplay', tryPlay, { once: true });
            tryPlay();
        }

        // ──────────────────────────────────────────────────────────
        // [v2.1.0] 음영지역(터널, 엘리베이터) 무인 자동 재개(Zero-Touch Auto-Resume) 가디언
        // ──────────────────────────────────────────────────────────
        function triggerDeadZoneStandby(reason = '네트워크 신호 단절') {
            if (!userWantsPlay || isDeadZoneStandby) return;
            isDeadZoneStandby = true;
            isLivePlaying = false;
            setButtonState('loading');
            setStatus('📶 음영지역 통과 중 — 신호 복구 시 즉시 자동 재생', 'warn');
            debugText.innerText = `Standby (${reason}) · Auto-reconnect active`;
            startDeadZoneProbe();
        }

        function startDeadZoneProbe() {
            if (deadZoneInterval) clearInterval(deadZoneInterval);
            deadZoneInterval = setInterval(async () => {
                if (!isDeadZoneStandby || !userWantsPlay) {
                    clearInterval(deadZoneInterval);
                    deadZoneInterval = null;
                    return;
                }
                if (isProbingNetwork) return;
                isProbingNetwork = true;

                try {
                    const testUrl = `https://miniapi.imbc.com/favicon.ico?_t=${Date.now()}`;
                    await fetch(testUrl, { method: 'HEAD', mode: 'no-cors', cache: 'no-store' });
                    // 신호 회복 성공!
                    isProbingNetwork = false;
                    clearInterval(deadZoneInterval);
                    deadZoneInterval = null;
                    resumeFromDeadZone();
                } catch (e) {
                    // 아직 음영지역(터널 안 등) -> 1.8초 후 계속 감시
                    isProbingNetwork = false;
                }
            }, 1800);
        }

        function resumeFromDeadZone() {
            if (!userWantsPlay) return;
            isDeadZoneStandby = false;
            setStatus('● 네트워크 신호 복구 감지 — 방송 즉시 자동 재개!', 'safe');
            debugText.innerText = 'Signal recovered! Auto-resuming...';
            activeCdnIndex = (activeCdnIndex + 1) % MBC_CDN_HOSTS.length; // 다음 건강한 CDN으로 전환
            setTimeout(() => {
                if (userWantsPlay) initStream(true);
            }, 300);
        }

        function switchBackupCdn() {
            activeCdnIndex = (activeCdnIndex + 1) % MBC_CDN_HOSTS.length;
            setStatus(`대체 CDN 서버(${MBC_CDN_HOSTS[activeCdnIndex]})로 무중단 전환 중...`, 'warn');
            setTimeout(() => {
                if (userWantsPlay) initStream(true);
            }, 800);
        }

        // ──────────────────────────────────────────────────────────
        // 7. 재생 제어 및 원클릭 즉각 복구
        // ──────────────────────────────────────────────────────────
        function startPlayback(force = false) {
            userWantsPlay = true;
            if (force || audio.paused || !isLivePlaying) {
                initStream(force);
            } else {
                audio.play().catch(() => initStream(true));
            }
        }

        function pausePlayback() {
            userWantsPlay = false;
            cleanAudioResources();
            if (wakeLockSentinel) {
                try { wakeLockSentinel.release(); } catch (e) {}
                wakeLockSentinel = null;
            }
            setStatus('일시 정지됨', 'idle');
            updateBufferGauge();
        }

        playBtn.onclick = () => {
            const isCurrentlyPlaying = !audio.paused && !audio.ended && isLivePlaying;
            if (isCurrentlyPlaying) {
                pausePlayback();
            } else {
                startPlayback(true);
            }
        };

        syncBtn.onclick = () => {
            activeCdnIndex = (activeCdnIndex + 1) % MBC_CDN_HOSTS.length;
            setStatus(`스트림 새로고침 (${MBC_CDN_HOSTS[activeCdnIndex]})...`, 'warn');
            fetchLiveSchedules().catch(() => {});
            userWantsPlay = true;
            initStream(true);
        };

        reloadScheduleBtn.onclick = () => {
            setStatus('편성표 업데이트 중...', 'warn');
            fetchLiveSchedules().then(() => {
                setStatus('최신 편성표 동기화 완료', 'safe');
            }).catch(() => {
                setStatus('편성표 수신 실패 (네트워크 확인)', 'error');
            });
        };

        volSlider.oninput = (e) => {
            audio.volume = e.target.value;
        };

        // ──────────────────────────────────────────────────────────
        // 8. 오디오 이벤트 & 백그라운드 화면 꺼짐 무중단 워커 가드
        // ──────────────────────────────────────────────────────────
        audio.onplaying = () => {
            if (!userWantsPlay) return;
            isLivePlaying = true;
            stallCounter = 0;
            setButtonState('playing');
            appViewport.classList.add('is-playing');
            setStatus('● 실시간 방송 청취 중 (딥 버퍼 가드 작동)', 'safe');
            debugText.innerText = `Live · ${MBC_CDN_HOSTS[activeCdnIndex]} · Deep Buffer ON`;
            if ('mediaSession' in navigator) navigator.mediaSession.playbackState = 'playing';
            updateBufferGauge();
        };

        audio.onwaiting = () => {
            if (!userWantsPlay) return;
            updateBufferGauge();
            if (tryBridgeMicroGap()) return;
            if (hls) {
                try { hls.startLoad(); } catch (e) {}
            }
            setButtonState('loading');
            setStatus('네트워크 버퍼 보충 중...', 'warn');
        };

        // [핵심 해결책 3] onstalled 발생 시 강제 시크(jumpToSafeMargin)로 오디오를 끊던 치명적 버그 제거!
        // 모바일 브라우저는 세그먼트 다운로드가 완료되어 3초간 대기할 때도 stalled 이벤트를 발생시킴.
        audio.onstalled = () => {
            if (!userWantsPlay) return;
            const bufSec = getBufferSeconds();
            if (hls && bufSec < adaptiveEngine.targetDelaySec) {
                try { hls.startLoad(); } catch (e) {}
            }
        };

        // 하드웨어 오디오 클럭에 의해 매 250ms마다 호출되는 timeupdate 이벤트 (화면이 꺼져도 절대 쓰로틀링되지 않음!)
        audio.ontimeupdate = () => {
            if (!userWantsPlay) return;
            const now = Date.now();
            if (now - lastBgKeepAliveTime >= 2000) {
                lastBgKeepAliveTime = now;
                updateBufferGauge();
                const bufSec = getBufferSeconds();
                if (hls && bufSec < adaptiveEngine.targetDelaySec - 5) {
                    try { hls.startLoad(); } catch (e) {}
                }
            }
        };

        audio.onerror = () => {
            if (!userWantsPlay) return;
            if (!navigator.onLine) {
                triggerDeadZoneStandby('네트워크 오프라인 감지');
            } else {
                setStatus('스트림 오류 감지 — 멀티 CDN 자동 복구 중...', 'warn');
                switchBackupCdn();
            }
        };

        // 1초 주기 상태 점검 함수 (메인 타이머 + 백그라운드 Web Worker 겸용)
        function runMonitorTick() {
            updateBufferGauge();
            adaptiveEngine.assessNetwork();
            adaptiveEngine.runLightweightPing();

            if (!userWantsPlay) {
                lastTickTime = 0;
                stallCounter = 0;
                return;
            }

            const now = Date.now();
            const bufSec = getBufferSeconds();

            // HLS 미사용(네이티브 폴백) 시에만 추정치 합산
            if (!hls && isLivePlaying && !audio.paused) {
                if (lastTickTime > 0) {
                    const dt = (now - lastTickTime) / 1000;
                    totalDataBytes += (64 * 1024 / 8) * dt;
                    if (metaTotalEl) {
                        metaTotalEl.innerText = `DATA: ${(totalDataBytes / (1024 * 1024)).toFixed(1)} MB`;
                    }
                }
                lastTickTime = now;
            }

            // 진짜 스톨(재생 멈춤) 정밀 감지 — 버퍼가 남아있을 때 섣불리 스트림을 파괴하지 않음
            if (isLivePlaying && !audio.paused) {
                if (audio.currentTime === lastAudioPosition) {
                    stallCounter++;
                    if (stallCounter === 2) {
                        tryBridgeMicroGap();
                        if (hls) {
                            try { hls.startLoad(); } catch (e) {}
                        }
                    } else if (stallCounter === 6 && bufSec < 1) {
                        if (!navigator.onLine) {
                            triggerDeadZoneStandby('터널/음영지역 감지');
                            return;
                        }
                        activeCdnIndex = (activeCdnIndex + 1) % MBC_CDN_HOSTS.length;
                        debugText.innerText = `Stall 6s → CDN switch ${MBC_CDN_HOSTS[activeCdnIndex]}`;
                        if (hls) {
                            try { hls.startLoad(); } catch (e) {}
                        }
                    } else if (stallCounter >= 12 && bufSec < 1) {
                        stallCounter = 0;
                        if (!navigator.onLine) {
                            triggerDeadZoneStandby('음영지역 버퍼 고갈');
                        } else {
                            debugText.innerText = 'Stall 12s (0s buf) → Auto-reconnecting';
                            switchBackupCdn();
                        }
                    }
                } else {
                    if (stallCounter > 0) {
                        setButtonState('playing');
                        setStatus('● 실시간 방송 청취 중 (딥 버퍼 가드 작동)', 'safe');
                    }
                    stallCounter = 0;
                }
                lastAudioPosition = audio.currentTime;
            }
        }

        // 백그라운드 화면 잠금 시에도 멈추지 않는 Web Worker 하드웨어 타이머 구동
        try {
            const workerBlob = new Blob([
                'setInterval(function(){ postMessage("tick"); }, 1000);'
            ], { type: 'application/javascript' });
            const bgWorker = new Worker(URL.createObjectURL(workerBlob));
            bgWorker.onmessage = () => runMonitorTick();
        } catch (e) {
            setInterval(runMonitorTick, 1000);
        }

        function setButtonState(state) {
            playBtn.classList.remove('is-loading', 'is-playing');
            if (state === 'loading') playBtn.classList.add('is-loading');
            if (state === 'playing') playBtn.classList.add('is-playing');
        }

        function setStatus(text, type = 'idle') {
            statusCaption.innerText = text;
            statusCaption.className = 'status-caption ' + (type === 'safe' ? 'safe' : type === 'warn' ? 'warn' : type === 'error' ? 'error' : '');
        }

        // 초기 편성표 로드
        fetchLiveSchedules().catch(() => {
            programTitleEl.innerText = 'MBC 표준FM (95.9MHz)';
            progTimeEl.innerText = '실시간 스트리밍';
        });
    });
    </script>
</body>
</html>
